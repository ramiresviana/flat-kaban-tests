    _externalUpdate: false,

    colCb:   { open: false, search: '' },
    groupCb: { open: false, search: '' },
    tagCb:   { open: false, search: '' },

    _boardScrollLock: false,
    _boardScrollLockMoveHandler: null,

    /**
     * Ordered tag list for column/group display: tagOrder entries first (even if empty),
     * then task tags not yet in tagOrder. Used by columns getter and comboboxes.
     * __untagged__ sentinel is always excluded — it is never a real tag column.
     */
    get columnsTagList() {
      const order = (Array.isArray(this.tagOrder) ? this.tagOrder : [])
        .filter(t => t !== '__untagged__');
      const taskTags = new Set(this.tasks.flatMap(t => t.tags));
      const extra = [...taskTags].filter(t => !order.includes(t)).sort();
      return [...order, ...extra];
    },

    /** Tags matching the current searchQuery, in columnsTagList order. */
    get searchSuggestions() {
      const q = this.searchQuery.toLowerCase().trim();
      const base = this.columnsTagList;
      if (!q) return base;
      return base.filter(t => t.includes(q));
    },

    /* ── Computed: tasks filtered by searchQuery only — newest first ── */
    get visibleTasks() {
      return this._applySearchFilter([...this.tasks].reverse());
    },

    /* ── Computed: live tasks in insertion order (oldest first) for list/none mode ── */
    get visibleTasksAsc() {
      return this._applySearchFilter([...this.tasks]);
    },

    /** Filter tasks by the current searchQuery. Returns the input array filtered in-place. */
    _applySearchFilter(tasks) {
      if (!this.searchQuery.trim()) return tasks;
      const q = this.searchQuery.toLowerCase();
      return tasks.filter(t =>
        t.raw.toLowerCase().includes(q) ||
        (t.title && t.title.toLowerCase().includes(q))
      );
    },

    /* ── Computed: tasks filtered for kanban view (tagFilter + search) ── */
    get kanbanTasks() {
      let result = this.visibleTasks;
      const tf = this.tagFilter;

      if (tf === 'all') {
        result = result.filter(t => t.tags.length > 0);
      } else if (tf !== 'none') {
        const tags = Array.isArray(tf) ? tf : [tf];
        result = result.filter(t => tags.some(tag => t.tags.includes(tag)));
      }
      return result;
    },

    /* ── Computed: columns for Kanban view ── */
    get columns() {
      const tf = this.tagFilter;
      if (tf === 'none') {
        // Flat mode: always show a single "All tasks" column, even when empty.
        return [{ tag: '', tasks: this._orderedTasksForTag('', this.kanbanTasks) }];
      }
      // Sanitise tag list: __untagged__ is a sentinel, never a real tag column.
      const rawTags = tf === 'all' ? this.columnsTagList
                    : Array.isArray(tf) ? tf
                    : [tf];
      const tags = rawTags.filter(t => t !== '__untagged__');
      const cols = tags.map(tag => ({
        tag,
        tasks: this._orderedTasksForTag(tag, this.kanbanTasks.filter(t => t.tags.includes(tag))),
      }));

      // Append the untagged column when there are untagged tasks OR when there are no
      // tasks at all (so users always have a column to add their first task).
      const untaggedTasks = this.visibleTasks.filter(t => t.tags.length === 0);
      if (untaggedTasks.length > 0 || !this.tasks.length) {
        cols.push({ tag: '__untagged__', tasks: this._orderedTasksForTag('__untagged__', untaggedTasks) });
      }

      return cols;
    },

    /* ── Computed: grouped task list ── */
    get groupedList() {
      const lg = this.listGroupBy;

      if (lg === 'none') {
        return [{ group: '', tasks: this.visibleTasksAsc }];
      }
      if (lg === 'all') {
        const result = [];
        const isSearching = Boolean(this.searchQuery && this.searchQuery.trim());
        for (const tag of this.columnsTagList) {
          const tasks = this._orderedTasksForTag(tag, this.visibleTasks.filter(t => t.tags.includes(tag)));
          if (isSearching || tasks.length) result.push({ group: tag, tasks });
        }
        const untagged = this._orderedTasksForTag('__untagged__', this.visibleTasks.filter(t => t.tags.length === 0));
        if (isSearching || untagged.length || !this.tasks.length) result.push({ group: 'untagged', tasks: untagged });
        return result;
      }
      const tags = Array.isArray(lg) ? lg : [lg];
      const result = [];
      const isSearching = Boolean(this.searchQuery && this.searchQuery.trim());
      for (const tag of tags) {
        const tasks = this._orderedTasksForTag(tag, this.visibleTasks.filter(t => t.tags.includes(tag)));
        if (isSearching || tasks.length) result.push({ group: tag, tasks });
      }
      // Untagged group: only tasks with NO tags at all (not merely lacking the selected tags)
      const untagged = this._orderedTasksForTag('__untagged__', this.visibleTasks.filter(t => t.tags.length === 0));
      if (isSearching || untagged.length || !this.tasks.length) result.push({ group: 'untagged', tasks: untagged });
      return result;
    },

    /* ── Lifecycle ── */
    init() {
      this.rawText = loadFromStorage();
      if (!this.rawText) {
        const { tasks, preferences } = parseDatabase(DEMO_DATA);

        this.tasks       = tasks;
        this.preferences = preferences;

        const allParsedTags = [...new Set(tasks.flatMap(t => t.tags))];
        this._syncTagOrder(allParsedTags);

        this.rawText = serializeDatabase(this.tasks, this.preferences);
      }

      const { tasks, preferences } = parseDatabase(this.rawText);
      this.tasks       = tasks;
      this.preferences = preferences;

      this._loadPreferences(preferences);
      this._applyTheme(this.theme);

      // Reactively reapply theme when it changes
      this.$watch('theme', val => this._applyTheme(val));

      // Persist UI preference changes back to the database file
      this.$watch('tagFilter',   val => { this.preferences.tagFilter   = val; this._saveDatabase(); });
      this.$watch('listGroupBy', val => { this.preferences.listGroupBy = val; this._saveDatabase(); });

      // Global error handlers — show error toast on unhandled errors
      window.onerror = (msg) => { this.errorMsg = String(msg); return false; };
      window.addEventListener('unhandledrejection', (e) => {
        this.errorMsg = e.reason?.message ?? String(e.reason);
      });

      // Multi-tab sync — reload when another tab writes to localStorage
      window.addEventListener('storage', (e) => {
        if (e.key !== STORAGE_KEY || e.newValue === null) return;
        this._reloadFromStorage(e.newValue);
      });
    },

    /* ── Theme helpers ── */
    _applyTheme(val) {
      if (val === 'light')      document.documentElement.setAttribute('data-theme', 'light');
      else if (val === 'dark')  document.documentElement.setAttribute('data-theme', 'dark');
      else                      document.documentElement.removeAttribute('data-theme');
    },

    /** Restore UI state from a parsed preferences object. */
    _loadPreferences(preferences) {
      this.theme       = preferences.theme       ?? 'auto';
      const storedTf   = preferences.tagFilter   ?? 'all';
      this.tagFilter   = storedTf === 'none' ? 'all' : storedTf;
      this.listGroupBy = preferences.listGroupBy ?? 'none';
      this.tagOrder    = (preferences.tagOrder   ?? []).filter(t => t !== '__untagged__');
    },

    toggleTheme() {
      const cycle = { auto: 'light', light: 'dark', dark: 'auto' };
      this.theme = cycle[this.theme] ?? 'auto';
      this.preferences.theme = this.theme;
      this._saveDatabase();
    },

    /* ── View switching ── */
    switchToRaw() {
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
      this.currentView = 'raw';
    },

    /* ── Display helpers ── */
    displayTitle(task) {
      if (task.title) return task.title;
      return '(no title)';
    },

    snippet(task) {
      const body = extractBody(task.raw);
      const words = body.split(/\s+/).filter(Boolean);
      const text = words.slice(0, SNIPPET_WORDS).join(' ');
      return words.length > SNIPPET_WORDS ? text + '…' : text;
    },

    /* ── Tag color palette ── */
    tagHue(tag) {
      let h = 0;
      for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) % 360;
      return Math.round(h / 30) * 30;
    },

    /** Select a tag suggestion: set search, close dropdown, scroll first matching task into view. */
    selectSearchSuggestion(tag) {
      this.searchQuery       = tag;
      this.searchSuggestOpen = false;
      this.$nextTick(() => {
        // Blur both search inputs so neither retains focus after a suggestion pick
        try { this.$refs?.searchInput?.blur(); } catch (e) {}
        try { this.$refs?.listSearchInput?.blur(); } catch (e) {}
        // In kanban view, scroll the matching column into view (suggestion = tag = column)
        if (this.currentView === 'kanban') {
          try {
            const colEl = document.querySelector(`.kanban-column[data-column-tag="${tag}"]`);
            if (colEl) colEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          } catch (e) {}
        }
      });
    },

    /* ── Combobox helpers: Columns filter ── */
    colFilteredTags() {
      const s    = this.colCb.search.toLowerCase();
      const base = this.columnsTagList;
      return s ? base.filter(t => t.includes(s)) : base;
    },
    colIsSelected(tag) {
      const tf = this.tagFilter;
      return Array.isArray(tf) ? tf.includes(tag) : tf === tag;
    },
    colIsSpecial(val) {
      const tf = this.tagFilter;
      return !Array.isArray(tf) && tf === val;
    },
    colToggleTag(tag) {
      const tf = this.tagFilter;
      if (Array.isArray(tf)) {
        const next = tf.includes(tag) ? tf.filter(t => t !== tag) : [...tf, tag];
        this.tagFilter = next.length === 0 ? 'all' : next;
      } else if (tf === tag) {
        this.tagFilter = 'all';
      } else {
        this.tagFilter = [tag];
      }
    },
    colSetSpecial(val) {
      this.tagFilter  = val;
      this.colCb.open   = false;
      this.colCb.search = '';
    },
    colDisplayText() {
      const tf = this.tagFilter;
      if (tf === 'none') return 'None';
      if (tf === 'all') return 'All tags';
      if (Array.isArray(tf)) return tf.length === 1 ? tf[0] : `${tf.length} tags`;
      return tf;
    },

    /* ── Combobox helpers: Group by ── */
    groupFilteredTags() {
      const s    = this.groupCb.search.toLowerCase();
      const base = this.columnsTagList;
      return s ? base.filter(t => t.includes(s)) : base;
    },
    groupIsSelected(tag) {
      const lg = this.listGroupBy;
      return Array.isArray(lg) ? lg.includes(tag) : lg === tag;
    },
    groupIsSpecial(val) {
      const lg = this.listGroupBy;
      return !Array.isArray(lg) && lg === val;
    },
    groupToggleTag(tag) {
      const lg = this.listGroupBy;
      if (Array.isArray(lg)) {
        const next = lg.includes(tag) ? lg.filter(t => t !== tag) : [...lg, tag];
        this.listGroupBy = next.length === 0 ? 'none' : next;
      } else if (lg === tag) {
        this.listGroupBy = 'none';
      } else {
        this.listGroupBy = [tag];
      }
    },
    groupSetSpecial(val) {
      this.listGroupBy    = val;
      this.groupCb.open   = false;
      this.groupCb.search = '';
    },
    groupDisplayText() {
      const lg = this.listGroupBy;
      if (lg === 'none') return 'None';
      if (lg === 'all') return 'All tags';
      if (Array.isArray(lg)) return lg.length === 1 ? lg[0] : `${lg.length} tags`;
      return lg;
    },

    /* ── Combobox helpers: Task detail tags ── */
    tagCbFilteredTags() {
      // Use columnsTagList for consistent ordering with columns/group comboboxes
      const s = this.tagCb.search.toLowerCase();
      const existing = this.selectedTask?.tags ?? [];
      const base = this.columnsTagList;
      return s
        ? base.filter(t => t.includes(s) && !existing.includes(t))
        : base.filter(t => !existing.includes(t));
    },
    tagCbCommit() {
      const raw = this.tagCb.search.trim();
      if (!raw) return;
      // addTag normalizes raw input (lowercase, strip invalid chars) before appending
      this.addTag(this.selectedTask, raw);
      this.tagCb.search = '';
    },

    /* ── Persistence ── */
    _saveDatabase() {
      if (this._externalUpdate) return;
      this.rawText = serializeDatabase(this.tasks, this.preferences);
      saveToStorage(this.rawText);
    },

    /** Reload in-memory state from a raw text string (called on storage events from other tabs). */
    _reloadFromStorage(rawText) {
      this._externalUpdate = true;
      const { tasks, preferences } = parseDatabase(rawText);
      this.rawText     = rawText;
      this.tasks       = tasks;
      this.preferences = preferences;
      this._loadPreferences(preferences);
      this._applyTheme(this.theme);
      this._externalUpdate = false;
    },

    autosave() {
      clearTimeout(_autosaveTimer);
      _autosaveTimer = setTimeout(() => {
        this._saveDatabase();
      }, AUTOSAVE_DELAY);
    },

    /* ─────────────────────────────────────────────
       EXPORT / IMPORT
       ───────────────────────────────────────────── */

    exportFile() {
      const blob = new Blob([this.rawText], { type: 'text/plain; charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'flat-kanban.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },

    importFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        if (typeof text !== 'string') return;
        const { tasks, preferences } = parseDatabase(text);
        tasks.forEach(task => {
          task.raw = buildTaskRaw(task.title, task.tags, extractBody(task.raw), task.tagPositions);
        });
        this.tasks       = tasks;
        this.preferences = preferences;
        this._loadPreferences(preferences);
        const allParsedTags = [...new Set(tasks.flatMap(t => t.tags))];
        this._syncTagOrder(allParsedTags);
        this._applyTaskOrderForAllTags();
        this._saveDatabase();
        // Sync raw editor so the Raw view shows the freshly imported content
        this.rawDraft  = this.rawText;
        this.rawEdited = false;
      };
      reader.readAsText(file, 'utf-8');
      // Reset so same file can be re-imported
      event.target.value = '';
    },

    /* ─────────────────────────────────────────────
       RAW VIEW
       ───────────────────────────────────────────── */

    saveRaw() {
      const { tasks, preferences } = parseDatabase(this.rawDraft);
      tasks.forEach(task => {
        task.raw = buildTaskRaw(task.title, task.tags, extractBody(task.raw), task.tagPositions);
      });
      this.tasks       = tasks;
      this.preferences = preferences;
      this._loadPreferences(preferences);
      const allParsedTags = [...new Set(tasks.flatMap(t => t.tags))];
      this._syncTagOrder(allParsedTags);
      this._applyTaskOrderForAllTags();
      this._saveDatabase();
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
    },

    discardRaw() {
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
    },

    /* ─────────────────────────────────────────────
       TASK DETAILS MODAL
       ───────────────────────────────────────────── */

    openTask(task) {
      // Blur search inputs so the board interaction takes focus
      try { this.$refs?.searchInput?.blur(); } catch (e) {}
      try { this.$refs?.listSearchInput?.blur(); } catch (e) {}
      this.searchSuggestOpen = false;
      this.selectedTask = task;
      this.bodyText     = extractBody(task.raw);
      this.tagCb.search = '';
      this.modalOpen    = true;
      this.$nextTick(() => {
        const selector = task.title ? '.modal-close-btn' : 'input, textarea, button';
        const modal = this.$refs.modal;
        if (modal) {
          const first = modal.querySelector(selector);
          if (first) first.focus();
        }
      });
    },

    closeTask() {
      if (this.selectedTask) {
        // Flush pending debounced edits before clearing state
        clearTimeout(_autosaveTimer);
        this.selectedTask.raw = buildTaskRaw(
          this.selectedTask.title,
          this.selectedTask.tags,
          this.bodyText,
          this.selectedTask.tagPositions
        );
        this._saveDatabase();
      }
      clearTimeout(_deleteTimer);
      this.deleteConfirmPending = false;
      this.modalOpen    = false;
      this.selectedTask = null;
      this.tagCb.search = '';
      this.tagCb.open   = false;
    },

    updateTitle(task, newTitle) {
      if (!task) return;
      const trimmed = newTitle.trim();
      task.title = trimmed || null;
      task.raw   = buildTaskRaw(task.title, task.tags, extractBody(task.raw), task.tagPositions);
      this.autosave();
    },

    updateBody(task, newBody) {
      if (!task) return;
      task.raw = buildTaskRaw(task.title, task.tags, newBody, task.tagPositions);
      this.autosave();
    },

    addTag(task, rawInput) {
      if (!task) return;
      const tag = rawInput.toLowerCase().replace(/[^a-z0-9_-]/g, '').trim();
      if (!tag || task.tags.includes(tag)) return;
      this._syncTagOrder([tag]);
      this._applyTagUpdate(task, [...task.tags, tag]);
    },

    removeTag(task, tag) {
      if (!task) return;
      this._applyTagUpdate(task, task.tags.filter(t => t !== tag));
    },

    deleteTask(task) {
      if (!task) return;
      if (!this.deleteConfirmPending) {
        this.deleteConfirmPending = true;
        _deleteTimer = setTimeout(() => { this.deleteConfirmPending = false; }, 3000);
        return;
      }
      clearTimeout(_deleteTimer);
      this.deleteConfirmPending = false;
      this.modalOpen    = false;
      this.selectedTask = null;
      this.tagCb.search = '';
      this.tagCb.open   = false;
      // Hard-delete: remove the task from the array and recompute positions for
      // every tag it belonged to so column ranks remain contiguous.
      const removedTags = [...task.tags];
      const idx = this.tasks.findIndex(t => t.id === task.id);
      if (idx !== -1) this.tasks.splice(idx, 1);
      for (const tag of removedTags) {
        const remaining = this._orderedTasksForTag(tag, this.tasks.filter(t => t.tags.includes(tag)));
        this._applyTaskOrder(tag, remaining);
      }
      this._saveDatabase();
    },

    /** Basic focus trap: cycle Tab within the modal element. */
    trapFocus(event) {
      const modal    = this.$refs.modal;
      if (!modal) return;
      const focusable = [...modal.querySelectorAll(
        'button, input, textarea, select, [tabindex]:not([tabindex="-1"])'
      )].filter(el => !el.disabled);
      if (!focusable.length) return;
      const first = focusable[0];
      const last  = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    },

    /* ─────────────────────────────────────────────
       DRAG AUTO-SCROLL
       ───────────────────────────────────────────── */

    /** Called on every document dragover to track pointer position. */
    _onDocDragOver(e) {
      this._dragPointerX = e.clientX;
      this._dragPointerY = e.clientY;
    },

    /**
     * Start a rAF loop that scrolls the kanban board horizontally and the hovered column
     * vertically when the pointer is near the edges during a drag.
     * Returns a cancel function; store it in `this._stopAutoScroll`.
     */
    _startAutoScroll() {
      let rafId, list, board, col, cards = null;

      if (this.currentView == 'list') {
        list = this.$refs.listPanel;
      } else if (this.currentView == 'kanban') {
        board = this.$refs.kanbanBoard;
        col = this._dragColEl;
        cards = col?.querySelector('.kanban-cards');
      }

      const lr = list?.getBoundingClientRect();
      const br = board?.getBoundingClientRect();

      let cr = cards?.getBoundingClientRect();

      const tick = () => {
        const px = this._dragPointerX || 0;
        const py = this._dragPointerY || 0;

        if (px == null || py == null) return;

        if (lr) {
          if (py < lr.top + AUTOSCROLL_EDGE_PX) {
            const ratio = 1 - (py - lr.top) / AUTOSCROLL_EDGE_PX;
            list.scrollTop -= AUTOSCROLL_MAX_PX * ratio;              
          } else if (py > lr.bottom - AUTOSCROLL_EDGE_PX && py <= lr.bottom) {
            const ratio = 1 - (lr.bottom - py) / AUTOSCROLL_EDGE_PX;
            list.scrollTop += AUTOSCROLL_MAX_PX * ratio;
          }
        } else if (br) {
          if (px < br.left + AUTOSCROLL_EDGE_PX && px >= br.left) {
            const ratio = 1 - (px - br.left) / AUTOSCROLL_EDGE_PX;
            board.scrollLeft -= AUTOSCROLL_MAX_PX * ratio;
          } else if (px > br.right - AUTOSCROLL_EDGE_PX && px <= br.right) {
            const ratio = 1 - (br.right - px) / AUTOSCROLL_EDGE_PX;
            board.scrollLeft += AUTOSCROLL_MAX_PX * ratio;
          }

          if (col !== this._dragColEl) {
            col = this._dragColEl;
            cards = col?.querySelector('.kanban-cards');
            cr = cards?.getBoundingClientRect();
          }

          if (cr) {
            if (py < cr.top + AUTOSCROLL_EDGE_PX && py >= cr.top) {
              const ratio = 1 - (py - cr.top) / AUTOSCROLL_EDGE_PX;
              cards.scrollTop -= AUTOSCROLL_MAX_PX * ratio;
            } else if (py > cr.bottom - AUTOSCROLL_EDGE_PX && py <= cr.bottom) {
              const ratio = 1 - (cr.bottom - py) / AUTOSCROLL_EDGE_PX;
              cards.scrollTop += AUTOSCROLL_MAX_PX * ratio;
            }
          }
        }

        rafId = requestAnimationFrame(tick);
      };

      rafId = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(rafId);
    },

    /* ─────────────────────────────────────────────
       KANBAN DRAG-AND-DROP
       ───────────────────────────────────────────── */

    dragStart(event, task, sourceTag) {
      this.draggedTask      = task;
      this.dragSourceColumn = sourceTag;
      this._dragColEl       = event.currentTarget.closest('.kanban-column');
      this._stopAutoScroll  = this._startAutoScroll();
      event.dataTransfer.effectAllowed = 'move';
      // Store task id so drop works even if state updates during drag
      event.dataTransfer.setData('text/plain', String(task.id));
      this._cachedColumns = this.columns;
    },

    dragEnd() {
      this._stopAutoScroll?.();
      this._stopAutoScroll = null;
      this._dragColEl       = null;
      this._resetKanbanDragState();
    },

    _resetKanbanDragState() {
      this.draggedTask      = null;
      this.dragSourceColumn = null;
      this.dropTarget       = null;
      this.dropBeforeId     = null;
      this.dropTargetColumn = null;
      this._cachedColumns   = null;
    },

    _resetListDragState() {
      this._stopAutoScroll?.();
      this.listDraggedTask      = null;
      this.listDropBeforeId     = null;
      this._listDragGroup       = null;
      this._listDropTargetGroup = null;
      this._cachedGroupList   = null;
    },

    dropOnColumn(event, targetTag) {
      if (this.colDragSource !== null) return;
      const taskId = parseInt(event.dataTransfer.getData('text/plain'), 10);
      const task   = this.tasks.find(t => t.id === taskId);
      this.dropTarget = null;
      if (!task) { this.dropBeforeId = null; this.dragEnd(); return; }
      if (this.dropBeforeId === task.id) { this.dropBeforeId = null; this.dragEnd(); return; }

      if (targetTag === '') {
        this._dropFlatReorder(task);
      } else if (targetTag === this.dragSourceColumn) {
        this._dropSameColumn(task, targetTag);
      } else if (targetTag === '__untagged__') {
        this._dropToUntagged(task);
      } else {
        this._dropToTagged(task, targetTag);
      }
      this.dragEnd();
    },

    _dropFlatReorder(task) {
      const col     = this.columns.find(c => c.tag === '');
      const ordered = this._reorderTasks(task, col ? col.tasks : [], this.dropBeforeId);
      this._applyTaskOrder('', ordered);
      this.dropBeforeId = null;
      this.autosave();
    },

    _dropSameColumn(task, tag) {
      const col = this.columns.find(c => c.tag === tag);
      if (!col) return;
      const ordered  = this._reorderTasks(task, col.tasks, this.dropBeforeId);
      const origIds  = col.tasks.map(t => t.id);
      const newIds   = ordered.map(t => t.id);
      const unchanged = origIds.length === newIds.length && origIds.every((v, i) => v === newIds[i]);
      if (!unchanged) { this._applyTaskOrder(tag, ordered); this.autosave(); }
    },

    _dropToUntagged(task) {
      const newTags = task.tags.filter(t => t !== this.dragSourceColumn);
      this._applyTagUpdate(task, newTags);
      if (this.dropBeforeId === null) return;
      const col     = this.columns.find(c => c.tag === '__untagged__');
      const ordered = this._reorderTasks(task, col ? col.tasks : [], this.dropBeforeId);
      this._applyTaskOrder('__untagged__', ordered);
    },

    _dropToTagged(task, targetTag) {
      let newTags = task.tags.filter(t => t !== this.dragSourceColumn);
      if (targetTag && !newTags.includes(targetTag)) newTags = [...newTags, targetTag];
      this._applyTagUpdate(task, newTags);
      const dropBeforeId = this.dropBeforeId; // capture before dragEnd clears state
      this.$nextTick(() => {
        const col = this.columns.find(c => c.tag === targetTag);
        if (!col) return;
        if (dropBeforeId !== null) {
          const ordered = this._reorderTasks(task, col.tasks, dropBeforeId);
          this._applyTaskOrder(targetTag, ordered);
        } else {
          this._applyTaskOrder(targetTag, col.tasks);
        }
      });
    },

    /** Central helper that rebuilds a task's raw block after a tag/title change. */
    /** Central helper that rebuilds a task's raw block after a tag/title change.
     * Also recomputes per-tag positions for all tags whose membership changed,
     * keeping column ranks contiguous. */
    _applyTagUpdate(task, newTags) {
      const body    = extractBody(task.raw);
      const oldTags = task.tags;
      // Preserve positions only for tags that remain in newTags
      const positions = Object.fromEntries(
        newTags
          .filter(t => task.tagPositions?.[t] !== undefined)
          .map(t => [t, task.tagPositions[t]])
      );
      task.tags        = newTags;
      task.tagPositions = positions;
      task.raw         = buildTaskRaw(task.title, newTags, body, positions);
      // Recompute contiguous positions for every tag whose membership changed
      const affected = [...new Set([...oldTags, ...newTags])];
      for (const tag of affected) {
        const ordered = this._orderedTasksForTag(tag, this.tasks.filter(t => t.tags.includes(tag)));
        this._applyTaskOrder(tag, ordered);
      }
      this.autosave();
    },

    /**
     * Reorder `task` in `orderedTasks` so it appears before `dropBeforeId`.
     * Returns the new ordered array; does NOT call _applyTaskOrder.
     */
    _reorderTasks(task, orderedTasks, dropBeforeId) {
      const list   = [...orderedTasks];
      const srcIdx = list.findIndex(t => t.id === task.id);
      if (srcIdx !== -1) list.splice(srcIdx, 1);
      const beforeIdx = dropBeforeId !== null ? list.findIndex(t => t.id === dropBeforeId) : -1;
      if (beforeIdx >= 0) list.splice(beforeIdx, 0, task);
      else list.push(task);
      return list;
    },

    /**
     * Return `tasks` sorted by their embedded per-tag position (#tag(N)).
     * Tasks without a stored position sort after all ranked tasks (stable by original order).
     */
    _orderedTasksForTag(tag, tasks) {
      if (!tag || tag === '__untagged__') return tasks;
      return [...tasks].sort((a, b) => {
        const posA = a.tagPositions?.[tag] ?? Infinity;
        const posB = b.tagPositions?.[tag] ?? Infinity;
        return posA - posB;
      });
    },

    /** Assign contiguous rank positions for `tag` in `tasks` and rebuild each task's raw. */
    _applyTaskOrder(tag, tasks) {
      if (!tag || tag === '__untagged__') return;
      tasks.forEach((task, index) => {
        task.tagPositions = { ...(task.tagPositions ?? {}), [tag]: index };
        task.raw = buildTaskRaw(task.title, task.tags, extractBody(task.raw), task.tagPositions);
      });
    },
    

    /** Append any candidateTags not yet in tagOrder (sorted). */
    /** Append any candidateTags not yet in tagOrder (sorted). */
    _syncTagOrder(candidateTags) {
      const order = Array.isArray(this.tagOrder) ? this.tagOrder : [];
      const added = candidateTags.filter(t => !order.includes(t)).sort();
      if (!added.length) return;
      this.tagOrder             = [...order, ...added];
      this.preferences.tagOrder = this.tagOrder;
    },

    /**
     * Stamp contiguous per-tag positions on every task in the database.
     * Called after import, raw-save, or any bulk operation that may leave
     * position numbers missing or non-contiguous.
     */
    _applyTaskOrderForAllTags() {
      const allTags = [...new Set(this.tasks.flatMap(t => t.tags))];
      for (const tag of allTags) {
        const ordered = this._orderedTasksForTag(tag, this.tasks.filter(t => t.tags.includes(tag)));
        this._applyTaskOrder(tag, ordered);
      }
    },

    addTaskToColumn(tag) {
      const newId = this.tasks.length ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
      const tags  = (tag && tag !== '__untagged__') ? [tag] : [];
      const raw   = buildTaskRaw(null, tags, '', {});
      const task  = { id: newId, raw, title: null, tags, tagPositions: {} };
      this.tasks.push(task);
      // Stamp the new task's position at the end of its tag column
      for (const t of tags) {
        const ordered = this._orderedTasksForTag(t, this.tasks.filter(tk => tk.tags.includes(t)));
        this._applyTaskOrder(t, ordered);
      }
      this.autosave();
      this.openTask(task);
    },

    /** Add task inside a list-group (group.group values: tag string, 'untagged', or '') */
    addTaskToGroup(groupKey) {
      if (groupKey === 'untagged') {
        this.addTaskToColumn('__untagged__');
        return;
      }
      this.addTaskToColumn(groupKey ?? '');
    },

    /* ─────────────────────────────────────────────
       CARD DRAG POSITION (all columns)
       ───────────────────────────────────────────── */

    /** Per-card dragover for any column — computes dropBeforeId using half-height heuristic. */
    cardDragOver(event, task, colTag) {
      if (this.colDragSource !== null) return;
      if (this.dropTargetColumn !== colTag) this.dropTargetColumn = colTag;
      // Track the column element for auto-scroll
      const colEl = event.currentTarget.closest('.kanban-column');
      if (this._dragColEl !== colEl) this._dragColEl = colEl;
      let newDropBeforeId;
      if (event.offsetY / event.target.offsetHeight < 0.5) {
        newDropBeforeId = task.id;
      } else {
        const col   = this._cachedColumns.find(c => c.tag === colTag);
        const tasks = col ? col.tasks : this.visibleTasks;
        const idx   = tasks.findIndex(t => t.id === task.id);
        const next  = tasks[idx + 1];
        newDropBeforeId = next ? next.id : null;
      }
      if (this.dropBeforeId !== newDropBeforeId) this.dropBeforeId = newDropBeforeId;
    },

    /* ─────────────────────────────────────────────
       COLUMN REORDER DRAG
       ───────────────────────────────────────────── */

    colHeaderDragStart(event, tag) {
      this.colDragSource    = tag;
      this._dragColEl       = null; // no column scroll during column reorder
      this._colIndexMap     = Object.fromEntries(this.columns.map((c, i) => [c.tag, i]));
      this._cachedColumns = this.columns;
      this._stopAutoScroll  = this._startAutoScroll();
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', `col:${tag}`);
    },

    colHeaderDragOver(event, tag) {
      let newTarget;
      if (event.offsetX / event.target.offsetWidth < 0.5) {
        newTarget = tag;
      } else {
        const idx  = this._colIndexMap[tag] ?? -1;
        const next = idx >= 0 ? this._cachedColumns[idx + 1] : null;
        newTarget = next ? next.tag : tag;
      }
      // Only update reactive state when the target changes to avoid redundant re-renders
      if (this.colDropTarget !== newTarget) this.colDropTarget = newTarget;
    },

    colHeaderDrop(event, tag) {
      this._stopAutoScroll?.();
      this._stopAutoScroll = null;
      const src = this.colDragSource;
      // Use the computed colDropTarget (if any) as the actual destination.
      const dst = this.colDropTarget ?? tag;
      this.colDragSource = null;
      this.colDropTarget = null;
      if (!src || src === dst) return;

      const ordered = [...this.columnsTagList];
      const srcIdx  = ordered.indexOf(src);
      if (srcIdx === -1) return;

      ordered.splice(srcIdx, 1);
      // Find dst in the post-splice array to get the correct insertion index
      const newDstIdx = ordered.indexOf(dst);
      if (newDstIdx >= 0) ordered.splice(newDstIdx, 0, src);
      else ordered.push(src);
      this.tagOrder             = ordered;
      this.preferences.tagOrder = ordered;
      this._saveDatabase();
    },

    colHeaderDragEnd() {
      this._stopAutoScroll?.();
      this._stopAutoScroll = null;
      this.colDragSource = null;
      this.colDropTarget = null;
      this._cachedColumns = null;
    },

    /** Clear column drop indicator when pointer truly leaves a column during column drag. */
    colColumnDragLeave(event) {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        this.colDropTarget = null;
      }
    },

    /* ─────────────────────────────────────────────
       KANBAN BOARD HORIZONTAL SCROLL (mouse-hold + wheel)
       ───────────────────────────────────────────── */

    boardMouseDown(event) {
      // Do not intercept clicks on interactive elements or draggable column headers
      if (event.target.closest('.task-card, button, input, textarea, a, select, [draggable="true"]')) return;
      if (event.button !== 0) return;

      // When interacting with the board, blur the global search input and close suggestions
      try {
        if (this.$refs?.searchInput) {
          this.$refs.searchInput.blur();
          this.searchSuggestOpen = false;
        }
      } catch (e) { /* defensive: ignore if refs unavailable */ }

      const board     = this.$refs.kanbanBoard;
      const startX    = event.pageX;
      const startLeft = board.scrollLeft;
      this.boardPanning = true;

      // Rolling sample buffer for time-corrected velocity (px / ms)
      const samples = [];

      const onMove = (e) => {
        samples.push({ x: e.pageX, t: performance.now() });
        // Prune samples outside the velocity window to keep only recent movement
        const cutoff = performance.now() - INERTIA_VELOCITY_WINDOW_MS;
        while (samples.length > 1 && samples[0].t < cutoff) samples.shift();
        board.scrollLeft = startLeft - (e.pageX - startX);
      };

      const onUp = () => {
        this.boardPanning = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onUp);
        this._startBoardInertia(board, samples);
      };

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onUp);
      event.preventDefault();
    },

    /** Apply fling inertia to the board after a mouse-up, using the sampled velocity. */
    _startBoardInertia(board, samples) {
      let vPxMs = 0;
      if (samples.length >= 2) {
        const first = samples[0];
        const last  = samples[samples.length - 1];
        const dt    = last.t - first.t;
        if (dt > 0) vPxMs = (last.x - first.x) / dt;
      }
      // Convert px/ms to px/frame at 60 fps
      let v = -vPxMs * (1000 / 60);
      const animate = () => {
        if (Math.abs(v) < INERTIA_MIN_PX) return;
        board.scrollLeft += v;
        v *= INERTIA_DECAY;
        requestAnimationFrame(animate);
      };
      requestAnimationFrame(animate);
    },

    /** Translate vertical wheel events into horizontal board scroll. */
    boardWheelScroll(event) {
      if (event.deltaY === 0) return;
      // While lock is active, route column-area wheel to horizontal board scroll
      const overColumn = !!event.target.closest('.kanban-cards');
      if (overColumn && !this._boardScrollLock) return; // normal column scroll
      event.preventDefault();
      this.$refs.kanbanBoard.scrollLeft += event.deltaY;
      this._setBoardScrollLock();
    },

    /** Activate the board-scroll lock and register a one-shot mousemove to clear it. */
    _setBoardScrollLock() {
      this._boardScrollLock = true;
      if (this._boardScrollLockMoveHandler) return;

      let movement = 0;
      this._boardScrollLockMoveHandler = (event) => {
        movement += Math.abs(event.movementX) + Math.abs(event.movementY);
        if (movement < 50) return;

        this._boardScrollLock = false;
        document.removeEventListener('mousemove', this._boardScrollLockMoveHandler);
        this._boardScrollLockMoveHandler = null;
      };
      document.addEventListener('mousemove', this._boardScrollLockMoveHandler);
    },

    /* ─────────────────────────────────────────────
       LIST ROW DRAG (reorder per group / flat)
       ───────────────────────────────────────────── */

    listRowDragStart(event, task, group) {
      if (this.listGroupBy === 'none') return;
      this.listDraggedTask  = task;
      this._listDragGroup   = group ?? '';
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', String(task.id));
      this._cachedGroupList = this.groupedList;
      this._stopAutoScroll  = this._startAutoScroll();
    },

    listRowDragOver(event, task, group) {
      if (this.listGroupBy === 'none') return;
      if (this.listDraggedTask == null) return;
      event.preventDefault();
      const newGroup = group ?? '';
      if (this._listDropTargetGroup !== newGroup) this._listDropTargetGroup = newGroup;
      let newDropBeforeId;
      if (event.offsetY / event.target.offsetHeight < 0.5) {
        newDropBeforeId = task.id;
      } else {
        const grp  = this._cachedGroupList.find(g => (g.group || '') === (group || ''));
        const list = grp ? grp.tasks : this.visibleTasks;
        const idx  = list.findIndex(t => t.id === task.id);
        const next = list[idx + 1];
        newDropBeforeId = next ? next.id : -1;
      }
      if (this.listDropBeforeId !== newDropBeforeId) this.listDropBeforeId = newDropBeforeId;
    },

    listRowDrop(event, group) {
      if (this.listGroupBy === 'none') return;
      if (this.listDraggedTask == null) return;
      event.preventDefault();
      const task = this.listDraggedTask;
      const targetGroup = group ?? '';
      const sourceGroup = this._listDragGroup ?? '';
      const isCrossGroup = sourceGroup !== targetGroup;

      if (isCrossGroup) {
        this._listCrossGroupDrop(task, sourceGroup, targetGroup);
        return;
      }

      if (this.listDropBeforeId === null) {
        this._resetListDragState();
        return;
      }

      // Dropping a task onto itself is a no-op
      if (this.listDropBeforeId === task.id) {
        this._resetListDragState();
        return;
      }

      const grp         = this.groupedList.find(g => (g.group || '') === targetGroup);
      const baseTasks   = grp ? grp.tasks : this.visibleTasks;
      const originalIds = baseTasks.map(t => t.id);
      const dropId      = this.listDropBeforeId !== -1 ? this.listDropBeforeId : null;
      const ordered     = this._reorderTasks(task, baseTasks, dropId);

      const newIds = ordered.map(t => t.id);
      const same = originalIds.length === newIds.length && originalIds.every((v, i) => v === newIds[i]);
      if (!same) {
        const orderKey = targetGroup === 'untagged' ? '__untagged__' : targetGroup;
        this._applyTaskOrder(orderKey, ordered);
        this.autosave();
      }
      this._resetListDragState();
    },

    _listCrossGroupDrop(task, sourceGroup, targetGroup) {
      const lg = this.listGroupBy;
      const activeTags = Array.isArray(lg) ? lg
        : lg === 'all' ? this.columnsTagList
        : [];

      let newTags = [...task.tags];

      // Remove source tag (only when source is a real tag, not 'untagged' or flat '')
      if (sourceGroup && sourceGroup !== 'untagged') {
        newTags = newTags.filter(t => t !== sourceGroup);
      }

      if (targetGroup === 'untagged') {
        // Remove all active group-by tags so the task becomes untagged in this view
        const activeTagSet = new Set(activeTags);
        newTags = newTags.filter(t => !activeTagSet.has(t));
      } else if (targetGroup && targetGroup !== 'untagged') {
        if (!newTags.includes(targetGroup)) newTags = [...newTags, targetGroup];
      }

      this._applyTagUpdate(task, newTags);

      // Reorder within target group after tag update is reflected
      const dropBeforeId = this.listDropBeforeId;
      if (dropBeforeId !== null) {
        this.$nextTick(() => {
          const grp = this.groupedList.find(g => (g.group || '') === (targetGroup || ''));
          if (!grp) return;
          const dropId   = dropBeforeId !== -1 ? dropBeforeId : null;
          const ordered  = this._reorderTasks(task, grp.tasks, dropId);
          const orderKey = targetGroup === 'untagged' ? '__untagged__' : targetGroup;
          this._applyTaskOrder(orderKey, ordered);
        });
      }

      this._resetListDragState();
    },

    /* ─────────────────────────────────────────────
       LIST VIEW HELPERS
       ───────────────────────────────────────────── */

    toggleGroup(group) {
      if (this.collapsedGroups.includes(group)) {
        this.collapsedGroups = this.collapsedGroups.filter(g => g !== group);
      } else {
        this.collapsedGroups = [...this.collapsedGroups, group];
      }
    },
  };
}
</script>
</body>
