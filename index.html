<!DOCTYPE html>
<!--
  Plain Kanban — single-file offline-capable Kanban app
  Data: plain text "database" in localStorage + export/import
  Reactivity: Alpine.js v3 (CDN, ~15 KB gzip) — chosen for zero-build, minimal API
  Icons: Feather Icons (CDN, SVG sprite)
  Font: Inter via Google Fonts
  No build step. Open index.html directly in any modern browser.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plain Kanban</title>

  <!-- Inter typeface ─ display=swap avoids FOIT -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Feather Icons — lightweight SVG icon set -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>

  <!-- Alpine.js v3 — deferred so x-data is ready before DOMContentLoaded -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>

  <style>
    /* ─────────────────────────────────────────────
       DESIGN TOKENS  (light scheme defaults)
       ───────────────────────────────────────────── */
    :root {
      /* Surface palette */
      --bg:           #f4f5f7;
      --surface:      #ffffff;
      --surface-2:    #eef0f3;
      --border:       #d8dce3;
      --border-focus: #5a8dee;

      /* Text */
      --text:         #1a1d23;
      --text-2:       #5a6070;
      --text-3:       #8f96a3;

      /* Accent */
      --accent:       #4a7cf7;
      --accent-hi:    #3567e8;
      --accent-dim:   #dce9ff;

      /* Semantic */
      --danger:       #e05252;
      --success:      #3cb87a;

      /* Spacing scale (0.25 rem steps) */
      --s1: 0.25rem;
      --s2: 0.5rem;
      --s3: 0.75rem;
      --s4: 1rem;
      --s5: 1.5rem;
      --s6: 2rem;

      /* Radii */
      --r1: 4px;
      --r2: 8px;
      --r3: 12px;

      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,.12);

      /* Transitions */
      --ease: 140ms ease;

      /* Typography */
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* ─────────────────────────────────────────────
       DARK SCHEME  (set via data-theme="dark" on <html>)
       ───────────────────────────────────────────── */
    [data-theme="dark"] {
      --bg:           #13151a;
      --surface:      #1e2029;
      --surface-2:    #272a35;
      --border:       #343847;
      --border-focus: #5a8dee;

      --text:         #e8eaf0;
      --text-2:       #9aa0b4;
      --text-3:       #5c6278;

      --accent:       #5a8dee;
      --accent-hi:    #6f9ef4;
      --accent-dim:   #1a2540;

      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    }

    /* Auto dark — defers to OS when no manual override is set */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg:           #13151a;
        --surface:      #1e2029;
        --surface-2:    #272a35;
        --border:       #343847;
        --border-focus: #5a8dee;

        --text:         #e8eaf0;
        --text-2:       #9aa0b4;
        --text-3:       #5c6278;

        --accent:       #5a8dee;
        --accent-hi:    #6f9ef4;
        --accent-dim:   #1a2540;

        --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      }
    }

    /* ─────────────────────────────────────────────
       RESET & BASE
       ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    a { color: var(--accent); text-decoration: none; }

    /* ─────────────────────────────────────────────
       APP LAYOUT  (flex column, full viewport)
       ───────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: 0 var(--s5);
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .header-logo {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      margin-right: var(--s3);
      display: flex;
      align-items: center;
      gap: var(--s2);
    }

    .header-logo svg { color: var(--accent); }

    /* View tabs */
    .view-tabs {
      display: flex;
      gap: var(--s1);
      background: var(--surface-2);
      border-radius: var(--r2);
      padding: var(--s1);
    }

    .view-tab {
      padding: var(--s1) var(--s3);
      border: none;
      background: transparent;
      border-radius: var(--r1);
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      transition: background var(--ease), color var(--ease);
    }

    .view-tab:hover { background: var(--border); color: var(--text); }
    .view-tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

    /* Header spacer */
    .header-spacer { flex: 1; }

    /* Icon button (theme toggle, export, import) */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--r1);
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      transition: background var(--ease), color var(--ease);
    }

    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    /* ─── MAIN CONTENT ─── */
    #main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── SUB-HEADER (filters) ─── */
    #subheader {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .filter-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      white-space: nowrap;
    }

    .filter-select {
      padding: var(--s1) var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
      cursor: pointer;
      min-width: 120px;
    }

    .filter-select:focus { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    .search-input {
      flex: 1;
      max-width: 280px;
      padding: var(--s1) var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
    }

    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { outline: 2px solid var(--border-focus); outline-offset: 2px; border-color: transparent; }

    /* ─── VIEW PANELS ─── */
    .view-panel {
      flex: 1;
      overflow: auto;
      padding: var(--s5);
    }

    /* ─────────────────────────────────────────────
       UTILITY CLASSES
       ───────────────────────────────────────────── */
    [x-cloak] { display: none !important; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Placeholder panel while views load */
    .placeholder-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-3);
      font-size: 0.875rem;
    }

    /* ─────────────────────────────────────────────
       KANBAN BOARD
       ───────────────────────────────────────────── */
    .kanban-board {
      display: flex;
      gap: var(--s4);
      height: 100%;
      align-items: flex-start;
      overflow-x: auto;
      padding-bottom: var(--s4);
    }

    .kanban-column {
      flex-shrink: 0;
      width: 284px;
      background: var(--surface);
      border-radius: var(--r3);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 100%;
      box-shadow: var(--shadow-sm);
    }

    .kanban-column-header {
      padding: var(--s2) var(--s4);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2);
    }

    .column-tag-name {
      font-weight: 600;
      font-size: 0.8125rem;
      text-transform: capitalize;
    }

    .column-count {
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-2);
      padding: 1px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }

    .kanban-cards {
      flex: 1;
      overflow-y: auto;
      padding: var(--s3);
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      min-height: 80px;
      border-radius: 0 0 var(--r3) var(--r3);
      transition: background var(--ease);
    }

    .kanban-cards.dragover {
      background: var(--accent-dim);
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
    }

    /* Task card */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      padding: var(--s3) var(--s4);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--ease), border-color var(--ease), opacity var(--ease);
      user-select: none;
    }

    .task-card:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-md);
    }

    .task-card:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .task-card.dragging { opacity: 0.35; }

    .task-card-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: var(--s1);
      line-height: 1.4;
    }

    .task-card-snippet {
      font-size: 0.8125rem;
      color: var(--text-2);
      line-height: 1.4;
      margin-bottom: var(--s2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .task-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s1);
    }

    .tag-chip {
      font-size: 0.6875rem;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .column-empty {
      text-align: center;
      color: var(--text-3);
      font-size: 0.8125rem;
      padding: var(--s5) var(--s4);
      border: 1px dashed var(--border);
      border-radius: var(--r2);
    }

    /* Add-task button inside column */
    .add-task-btn {
      display: flex;
      align-items: center;
      gap: var(--s2);
      width: 100%;
      padding: var(--s2) var(--s4);
      border: none;
      border-top: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 0.8125rem;
      color: var(--text-3);
      border-radius: 0 0 var(--r3) var(--r3);
      transition: background var(--ease), color var(--ease);
    }

    .add-task-btn:hover { background: var(--surface-2); color: var(--accent); }
    .add-task-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }

    /* ─────────────────────────────────────────────
       LIST VIEW
       ───────────────────────────────────────────── */
    .list-view {
      display: flex;
      flex-direction: column;
      gap: var(--s4);
    }

    .list-controls {
      display: flex;
      align-items: center;
      gap: var(--s3);
    }

    .list-section { /* one per group */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      overflow: hidden;
    }

    .list-group-header {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: var(--s2) var(--s4);
      background: var(--surface-2);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      user-select: none;
      font-weight: 600;
      font-size: 0.8125rem;
    }

    .list-group-header:hover { background: var(--border); }

    .group-chevron {
      transition: transform var(--ease);
      color: var(--text-3);
      flex-shrink: 0;
    }

    .group-chevron.collapsed { transform: rotate(-90deg); }

    .group-count {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--text-3);
      margin-left: auto;
    }

    .list-table {
      width: 100%;
      border-collapse: collapse;
    }

    .list-table th {
      padding: var(--s2) var(--s4);
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      white-space: nowrap;
    }

    .list-table th.sortable {
      cursor: pointer;
      user-select: none;
    }

    .list-table th.sortable:hover { color: var(--text); }

    .sort-icon {
      display: inline-flex;
      align-items: center;
      margin-left: 3px;
      color: var(--accent);
      vertical-align: middle;
    }

    .list-table td {
      padding: var(--s2) var(--s4);
      font-size: 0.8125rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .list-table tr:last-child td { border-bottom: none; }

    .list-table tr:hover td { background: var(--surface-2); cursor: pointer; }

    .list-title-cell {
      font-weight: 500;
      color: var(--text);
      min-width: 140px;
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-snippet-cell {
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 340px;
    }

    .list-tags-cell {
      white-space: nowrap;
      min-width: 80px;
    }

    .list-tags-cell .tag-chip { margin-right: 3px; }

    /* ─────────────────────────────────────────────
       TASK DETAILS MODAL
       ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 101;
      width: min(640px, calc(100vw - 2 * var(--s5)));
      max-height: calc(100vh - 4 * var(--s5));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r3);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: flex-start;
      gap: var(--s3);
      padding: var(--s4) var(--s5);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title-input {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      padding: 0;
      line-height: 1.4;
    }

    .modal-title-input::placeholder { color: var(--text-3); font-weight: 400; }
    .modal-title-input:focus { border-bottom: 2px solid var(--border-focus); }

    .modal-close-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: var(--r1);
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      font-size: 1rem;
      transition: background var(--ease), color var(--ease);
    }

    .modal-close-btn:hover { background: var(--surface-2); color: var(--text); }
    .modal-close-btn:focus-visible { outline: 2px solid var(--border-focus); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--s4) var(--s5);
      display: flex;
      flex-direction: column;
      gap: var(--s4);
    }

    /* Tag editor */
    .modal-section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
      margin-bottom: var(--s2);
    }

    .tag-editor {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s1);
      align-items: center;
      padding: var(--s2);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      min-height: 38px;
      background: var(--surface-2);
      cursor: text;
    }

    .tag-editor:focus-within { border-color: var(--border-focus); background: var(--surface); }

    .tag-chip-removable {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 4px 2px 8px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .tag-remove-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      color: var(--accent);
      font-size: 0.75rem;
      padding: 0;
      transition: background var(--ease);
    }

    .tag-remove-btn:hover { background: var(--accent); color: #fff; }

    .tag-add-input {
      flex: 1;
      min-width: 100px;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.8125rem;
      color: var(--text);
      padding: 2px 0;
    }

    .tag-add-input::placeholder { color: var(--text-3); }

    /* Body textarea */
    .modal-body-textarea {
      width: 100%;
      min-height: 200px;
      resize: vertical;
      padding: var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.875rem;
      line-height: 1.6;
      font-family: var(--font);
    }

    .modal-body-textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      background: var(--surface);
    }

    /* Modal footer (delete button) */
    .modal-footer {
      padding: var(--s3) var(--s5);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn-danger {
      padding: var(--s1) var(--s4);
      border: 1px solid var(--danger);
      border-radius: var(--r1);
      background: transparent;
      color: var(--danger);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }

    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-danger:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }

    /* ─────────────────────────────────────────────
       RAW VIEW
       ───────────────────────────────────────────── */
    .raw-view {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .raw-toolbar {
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .unsaved-badge {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .btn-primary {
      padding: var(--s1) var(--s4);
      border: 1px solid var(--accent);
      border-radius: var(--r1);
      background: var(--accent);
      color: #fff;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--ease);
    }

    .btn-primary:hover { background: var(--accent-hi); }
    .btn-primary:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }

    .btn-secondary {
      padding: var(--s1) var(--s4);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: transparent;
      color: var(--text-2);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }

    .btn-secondary:hover { background: var(--surface-2); color: var(--text); }
    .btn-secondary:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    .raw-hint {
      font-size: 0.75rem;
      color: var(--text-3);
      margin-left: auto;
    }

    .raw-editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: var(--s5);
      background: var(--bg);
      color: var(--text);

      line-height: 1.7;

    }

    .raw-editor:focus { background: var(--surface); }

    /* ─────────────────────────────────────────────
       TOAST NOTIFICATION
       ───────────────────────────────────────────── */
    .toast {
      position: fixed;
      bottom: var(--s5);
      right: var(--s5);
      padding: var(--s2) var(--s5);
      background: var(--text);
      color: var(--bg);
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--r2);
      box-shadow: var(--shadow-md);
      z-index: 300;
      pointer-events: none;

    }

  </style>
</head>

<!-- ═══════════════════════════════════════════════
     APPLICATION SCRIPT
     Sections: CONSTANTS | PARSER | SERIALIZER | STORAGE | APP
═══════════════════════════════════════════════ -->
<script>
/* ─────────────────────────────────────────────────
   CONSTANTS
   ───────────────────────────────────────────────── */
const STORAGE_KEY   = 'pk_db';
const PREF_MARKER   = '---PREFERENCES---';
const TASK_SEP      = '\n---\n';
const TITLE_RE      = /#title\(([^)]*)\)/;
const TAG_RE        = /#([a-zA-Z][a-zA-Z0-9_-]*)/g;
// A line is a "managed metadata line" if every non-empty token starts with #
const MANAGED_LINE_RE = /^(\s*#[a-zA-Z][a-zA-Z0-9_-]*\s*)+$/;
const TITLE_LINE_RE   = /^#title\([^)]*\)$/;
const AUTOSAVE_DELAY  = 400;   // ms debounce for UI edits
const SNIPPET_WORDS   = 20;
const TITLE_FALLBACK_WORDS = 8;

/* ─────────────────────────────────────────────────
   PARSER  (text → model)
   Rules:
   - Split on TASK_SEP to get blocks
   - Preferences section follows PREF_MARKER line
   - #title(...) anywhere in block → explicit title
   - #word tokens (not inside #title) → tags (normalized)
   ───────────────────────────────────────────────── */

/** Parse a raw #title(...) out of a block string. Returns title string or null. */
function parseTitle(block) {
  const m = block.match(TITLE_RE);
  return m ? m[1].trim() : null;
}

/** Collect all #tag tokens, excluding the literal word "title" used in #title(). */
function parseTags(block) {
  // Strip #title(...) occurrences first so "title" token is not captured
  const stripped = block.replace(/#title\([^)]*\)/g, '');
  const tags = new Set();
  let m;
  TAG_RE.lastIndex = 0;
  while ((m = TAG_RE.exec(stripped)) !== null) {
    tags.add(m[1].toLowerCase());
  }
  return [...tags];
}

/** Parse a single block of raw text into a Task object. */
function parseTask(raw, id) {
  const trimmed = raw.trim();
  if (!trimmed) return null;
  return {
    id,
    raw: trimmed,
    title: parseTitle(trimmed),
    tags:  parseTags(trimmed),
  };
}

/** Parse preferences key=value text into a Preferences object. */
function parsePreferences(text) {
  const defaults = {
    theme:        'auto',
    tagFilter:    'all',
    listGroupBy:  'none',
    listSortBy:   'title',
    listSortDir:  'asc',
  };
  if (!text) return defaults;
  for (const line of text.split('\n')) {
    const eq = line.indexOf('=');
    if (eq === -1) continue;
    const k = line.slice(0, eq).trim();
    const v = line.slice(eq + 1).trim();
    if (k in defaults) defaults[k] = v;
  }
  return defaults;
}

/**
 * parseDatabase(text) → { tasks: Task[], preferences: Preferences }
 * Round-trip safe: tasks preserve their original `raw` strings.
 */
function parseDatabase(text) {
  let mainText = text;
  let prefText = '';

  const prefIdx = text.indexOf(PREF_MARKER);
  if (prefIdx !== -1) {
    mainText = text.slice(0, prefIdx);
    prefText = text.slice(prefIdx + PREF_MARKER.length);
  }

  const tasks = mainText
    .split(TASK_SEP)
    .map((block, i) => parseTask(block, i + 1))
    .filter(Boolean);

  return { tasks, preferences: parsePreferences(prefText) };
}

/* ─────────────────────────────────────────────────
   SERIALIZER  (model → text)
   Round-trip rule: tasks are stored by their .raw — never reprocessed unless
   the user edits them via UI, in which case buildTaskRaw() rebuilds the block.
   ───────────────────────────────────────────────── */

/**
 * Extract the "body" of a task block — everything that is NOT a managed
 * metadata line (#title(...) or a line consisting solely of #tag tokens).
 * Preserves user prose verbatim.
 */
function extractBody(raw) {
  const lines = raw.split('\n');
  const bodyLines = lines.filter(line => {
    const t = line.trim();
    if (!t) return true;                      // keep blank lines
    if (TITLE_LINE_RE.test(t)) return false;  // managed title line
    if (MANAGED_LINE_RE.test(t)) return false; // managed tag line
    return true;
  });
  return bodyLines.join('\n').trimEnd();
}

/**
 * Rebuild a task block from its constituent parts.
 * Managed metadata is placed at the top; user body follows.
 */
function buildTaskRaw(title, tags, body) {
  const parts = [];
  if (title && title.trim()) parts.push(`#title(${title.trim()})`);
  if (tags && tags.length)   parts.push(tags.map(t => `#${t}`).join(' '));
  if (body && body.trim())   parts.push(body.trim());
  return parts.join('\n');
}

/** Serialize preferences object to key=value lines. */
function serializePreferences(prefs) {
  return Object.entries(prefs).map(([k, v]) => `${k}=${v}`).join('\n');
}

/**
 * serializeDatabase(tasks, preferences) → string
 * Joins task.raw values with TASK_SEP; appends preferences section.
 */
function serializeDatabase(tasks, preferences) {
  const body = tasks.map(t => t.raw).join(TASK_SEP);
  const prefSection = `\n${PREF_MARKER}\n${serializePreferences(preferences)}`;
  return body + prefSection;
}

/* ─────────────────────────────────────────────────
   STORAGE  (localStorage + demo seed)
   ───────────────────────────────────────────────── */

const DEMO_DATA = `#title(Design new landing page)

Use OpenAPI 3.1 schema. Publish on the developer portal.
Assign to: backend team.

/** Load raw text from localStorage, falling back to demo seed on first run. */
function loadFromStorage() {
  return localStorage.getItem(STORAGE_KEY) ?? DEMO_DATA;
}

/** Persist raw text to localStorage. */
function saveToStorage(text) {
  localStorage.setItem(STORAGE_KEY, text);
}

/* ─────────────────────────────────────────────────
   APP  (Alpine.js component)
   Provides all reactive state and logic consumed by the template.
   ───────────────────────────────────────────────── */
function kanbanApp() {
  let _autosaveTimer = null;

  return {
    /* ── State ── */
    currentView:    'kanban',
    theme:          'auto',
    tagFilter:      'all',
    searchQuery:    '',
    tasks:          [],
    preferences:    {},
    rawText:        '',
    statusMsg:      '',

    // Phase 4 drag state (stub — wired in Phase 4)
    draggedTask:       null,
    dragSourceColumn:  null,
    dropTarget:        null,

    // Phase 5 list state (stub — wired in Phase 5)
    listGroupBy:    'none',
    listSortBy:     'title',
    listSortDir:    'asc',
    collapsedGroups: [],

    // Phase 6 modal state (stub — wired in Phase 6)
    selectedTask:   null,
    modalOpen:      false,
    newTagInput:    '',
    bodyText:       '',

    // Phase 7 raw state (stub — wired in Phase 7)
    rawDraft:       '',
    rawEdited:      false,

    /* ── Computed: all unique sorted tags across all tasks ── */
    get allTags() {
      const set = new Set();
      this.tasks.forEach(t => t.tags.forEach(tag => set.add(tag)));
      return [...set].sort();
    },

    /* ── Computed: tasks filtered by tagFilter + searchQuery ── */
    get visibleTasks() {
      let result = this.tasks;

      if (this.tagFilter === 'all') {
        result = result.filter(t => t.tags.length > 0);
      } else if (this.tagFilter !== 'none') {
        result = result.filter(t => t.tags.includes(this.tagFilter));
      }

      if (this.searchQuery.trim()) {
        const q = this.searchQuery.toLowerCase();
        result = result.filter(t =>
          t.raw.toLowerCase().includes(q) ||
          (t.title && t.title.toLowerCase().includes(q))
        );
      }
      return result;
    },

    /* ── Computed: columns for Kanban view ── */
    get columns() {
      if (this.tagFilter === 'none') {
        // No tag grouping: single flat column showing all visible tasks
        return this.visibleTasks.length
          ? [{ tag: 'All Tasks', tasks: this.visibleTasks }]
          : [];
      }
      const tags = this.tagFilter === 'all' ? this.allTags : [this.tagFilter];
      return tags.map(tag => ({
        tag,
        tasks: this.visibleTasks.filter(t => t.tags.includes(tag)),
      }));
    },

    /* ── Computed: sorted tasks for List view ── */
    get sortedTasks() {
      const compareFn = this.listSortBy === 'title'
        ? (a, b) => this.displayTitle(a).localeCompare(this.displayTitle(b))
        : (a, b) => a.tags.length - b.tags.length;
      const dir = this.listSortDir === 'asc' ? 1 : -1;
      return [...this.visibleTasks].sort((a, b) => compareFn(a, b) * dir);
    },

    /* ── Computed: grouped task list ── */
    get groupedList() {
      if (this.listGroupBy === 'none') {
        return [{ group: '', tasks: this.sortedTasks }];
      }
      const tag   = this.listGroupBy;
      const inGroup   = this.sortedTasks.filter(t => t.tags.includes(tag));
      const outGroup  = this.sortedTasks.filter(t => !t.tags.includes(tag));
      const result = [];
      if (inGroup.length)  result.push({ group: tag,       tasks: inGroup });
      if (outGroup.length) result.push({ group: 'untagged', tasks: outGroup });
      return result;
    },

    /* ── Lifecycle ── */
    init() {
      this.rawText = loadFromStorage();
      const { tasks, preferences } = parseDatabase(this.rawText);
      this.tasks       = tasks;
      this.preferences = preferences;

      // Restore persisted UI state
      this.theme       = preferences.theme       ?? 'auto';
      this.tagFilter   = preferences.tagFilter   ?? 'all';
      this.listGroupBy = preferences.listGroupBy ?? 'none';
      this.listSortBy  = preferences.listSortBy  ?? 'title';
      this.listSortDir = preferences.listSortDir ?? 'asc';

      this._applyTheme(this.theme);

      // Reactively reapply theme when it changes
      this.$watch('theme', val => this._applyTheme(val));

      // Persist UI preference changes back to the database file
      this.$watch('tagFilter',   val => { this.preferences.tagFilter   = val; this._saveDatabase(); });
      this.$watch('listGroupBy', val => { this.preferences.listGroupBy = val; this._saveDatabase(); });
    },

    /* ── Theme helpers ── */
    _applyTheme(val) {
      if (val === 'light')      document.documentElement.setAttribute('data-theme', 'light');
      else if (val === 'dark')  document.documentElement.setAttribute('data-theme', 'dark');
      else                      document.documentElement.removeAttribute('data-theme');
    },

    toggleTheme() {
      const cycle = { auto: 'light', light: 'dark', dark: 'auto' };
      this.theme = cycle[this.theme] ?? 'auto';
      this.preferences.theme = this.theme;
      this._saveDatabase();
    },

    /* ── View switching ── */
    switchToRaw() {
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
      this.currentView = 'raw';
    },

    /* ── Display helpers ── */
    displayTitle(task) {
      if (task.title) return task.title;
      const words = task.raw
        .replace(/#title\([^)]*\)/g, '')
        .replace(/#[a-zA-Z][a-zA-Z0-9_-]*/g, '')
        .trim()
        .split(/\s+/)
        .filter(Boolean);
      return words.slice(0, TITLE_FALLBACK_WORDS).join(' ') || '(empty task)';
    },

    snippet(task) {
      const body = extractBody(task.raw);
      const words = body.split(/\s+/).filter(Boolean);
      const text = words.slice(0, SNIPPET_WORDS).join(' ');
      return words.length > SNIPPET_WORDS ? text + '…' : text;
    },

    /* ── Persistence ── */
    _saveDatabase() {
      this.rawText = serializeDatabase(this.tasks, this.preferences);
      saveToStorage(this.rawText);
    },

    autosave() {
      clearTimeout(_autosaveTimer);
      _autosaveTimer = setTimeout(() => {
        this._saveDatabase();
        this._toast('Saved');
      }, AUTOSAVE_DELAY);
    },

    _toast(msg) {
      this.statusMsg = msg;
      setTimeout(() => { this.statusMsg = ''; }, 2000);
    },

    /* ── Stubs: wired in later phases ── */

    /* ─────────────────────────────────────────────
       PHASE 8: EXPORT / IMPORT
       ───────────────────────────────────────────── */

    exportFile() {
      const blob = new Blob([this.rawText], { type: 'text/plain; charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'plain-kanban.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      this._toast('Exported');
    },

    importFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        if (typeof text !== 'string') return;
        this.rawText = text;
        const { tasks, preferences } = parseDatabase(text);
        this.tasks       = tasks;
        this.preferences = preferences;
        this.theme       = preferences.theme       ?? 'auto';
        this.tagFilter   = preferences.tagFilter   ?? 'all';
        this.listGroupBy = preferences.listGroupBy ?? 'none';
        this.listSortBy  = preferences.listSortBy  ?? 'title';
        this.listSortDir = preferences.listSortDir ?? 'asc';
        this._applyTheme(this.theme);
        saveToStorage(text);
        this._toast(`Imported ${tasks.length} task${tasks.length === 1 ? '' : 's'}`);
      };
      reader.onerror = () => this._toast('Import failed — could not read file');
      reader.readAsText(file, 'utf-8');
      // Reset so same file can be re-imported
      event.target.value = '';
    },

    /* ─────────────────────────────────────────────
       PHASE 7: RAW VIEW
       ───────────────────────────────────────────── */

    saveRaw() {
      this.rawText  = this.rawDraft;
      const { tasks, preferences } = parseDatabase(this.rawText);
      this.tasks       = tasks;
      this.preferences = preferences;
      // Restore UI state that may have changed in raw text
      this.theme       = preferences.theme       ?? 'auto';
      this.tagFilter   = preferences.tagFilter   ?? 'all';
      this.listGroupBy = preferences.listGroupBy ?? 'none';
      this.listSortBy  = preferences.listSortBy  ?? 'title';
      this.listSortDir = preferences.listSortDir ?? 'asc';
      saveToStorage(this.rawText);
      this.rawEdited = false;
      this._toast('Saved');
    },

    discardRaw() {
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
    },

    /* ─────────────────────────────────────────────
       PHASE 6: TASK DETAILS MODAL
       ───────────────────────────────────────────── */

    openTask(task) {
      this.selectedTask = task;
      this.bodyText     = extractBody(task.raw);
      this.newTagInput  = '';
      this.modalOpen    = true;
      this.$nextTick(() => {
        const modal = this.$refs.modal;
        if (modal) {
          const first = modal.querySelector('input, textarea, button');
          if (first) first.focus();
        }
      });
    },

    closeTask() {
      this.modalOpen    = false;
      this.selectedTask = null;
      this.newTagInput  = '';
    },

    updateTitle(task, newTitle) {
      if (!task) return;
      const trimmed = newTitle.trim();
      task.title = trimmed || null;
      task.raw   = buildTaskRaw(task.title, task.tags, extractBody(task.raw));
      this.autosave();
    },

    updateBody(task, newBody) {
      if (!task) return;
      task.raw = buildTaskRaw(task.title, task.tags, newBody);
      this.autosave();
    },

    addTag(task, rawInput) {
      if (!task) return;
      const tag = rawInput.toLowerCase().replace(/[^a-z0-9_-]/g, '').trim();
      if (!tag || task.tags.includes(tag)) return;
      this._applyTagUpdate(task, [...task.tags, tag]);
    },

    removeTag(task, tag) {
      if (!task) return;
      this._applyTagUpdate(task, task.tags.filter(t => t !== tag));
    },

    commitNewTag() {
      if (!this.newTagInput.trim()) return;
      this.addTag(this.selectedTask, this.newTagInput);
      this.newTagInput = '';
    },

    deleteTask(task) {
      if (!task) return;
      if (!confirm(`Delete "${this.displayTitle(task)}"?`)) return;
      this.tasks   = this.tasks.filter(t => t.id !== task.id);
      this.closeTask();
      this._saveDatabase();
      this._toast('Task deleted');
    },

    /** Basic focus trap: cycle Tab within the modal element. */
    trapFocus(event) {
      const modal    = this.$refs.modal;
      if (!modal) return;
      const focusable = [...modal.querySelectorAll(
        'button, input, textarea, select, [tabindex]:not([tabindex="-1"])'
      )].filter(el => !el.disabled);
      if (!focusable.length) return;
      const first = focusable[0];
      const last  = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    },

    /* ─────────────────────────────────────────────
       PHASE 4: KANBAN DRAG-AND-DROP
       ───────────────────────────────────────────── */

    dragStart(event, task, sourceTag) {
      this.draggedTask      = task;
      this.dragSourceColumn = sourceTag;
      event.dataTransfer.effectAllowed = 'move';
      // Store task id so drop works even if state updates during drag
      event.dataTransfer.setData('text/plain', String(task.id));
    },

    dragOver(event, targetTag) {
      this.dropTarget = targetTag;
    },

    dragLeave(event) {
      this.dropTarget = null;
    },

    dragEnd() {
      this.draggedTask      = null;
      this.dragSourceColumn = null;
      this.dropTarget       = null;
    },

    dropOnColumn(event, targetTag) {
      const taskId = parseInt(event.dataTransfer.getData('text/plain'), 10);
      const task   = this.tasks.find(t => t.id === taskId);
      this.dropTarget = null;

      if (!task) return;
      const sourceTag = this.dragSourceColumn;
      if (targetTag === sourceTag) return;

      // Build new tag list: remove source column tag, add target column tag
      let newTags = task.tags.filter(t => t !== sourceTag);
      if (!newTags.includes(targetTag)) newTags = [...newTags, targetTag];

      this._applyTagUpdate(task, newTags);
      this.dragEnd();
    },

    /** Central helper that rebuilds a task's raw block after a tag/title change. */
    _applyTagUpdate(task, newTags) {
      const body    = extractBody(task.raw);
      task.raw      = buildTaskRaw(task.title, newTags, body);
      task.tags     = newTags;
      this.autosave();
    },

    addTaskToColumn(tag) {
      const newId  = this.tasks.length ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
      const raw    = buildTaskRaw(null, [tag], 'New task');
      const task   = { id: newId, raw, title: null, tags: [tag] };
      this.tasks.push(task);
      this.autosave();
      // Open modal immediately so user can edit (wired in Phase 6 — no-op until then)
      this.openTask(task);
    },

    /* ─────────────────────────────────────────────
       PHASE 5: LIST VIEW HELPERS
       ───────────────────────────────────────────── */

    toggleSort(col) {
      if (this.listSortBy === col) {
        this.listSortDir = this.listSortDir === 'asc' ? 'desc' : 'asc';
      } else {
        this.listSortBy  = col;
        this.listSortDir = 'asc';
      }
      this.preferences.listSortBy  = this.listSortBy;
      this.preferences.listSortDir = this.listSortDir;
      this._saveDatabase();
    },

    toggleGroup(group) {
      if (this.collapsedGroups.includes(group)) {
        this.collapsedGroups = this.collapsedGroups.filter(g => g !== group);
      } else {
        this.collapsedGroups = [...this.collapsedGroups, group];
      }
    },
  };
}
</script>
