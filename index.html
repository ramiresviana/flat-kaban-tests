/* ─────────────────────────────────────────────────
   APP  (Alpine.js component)
   Provides all reactive state and logic consumed by the template.
   ───────────────────────────────────────────────── */
function kanbanApp() {
  let _autosaveTimer = null;
  let _deleteTimer   = null;

  return {
    /* ── State ── */
    currentView:    'kanban',
    theme:          'auto',
    tagFilter:      'all',
    searchQuery:      '',
    searchSuggestOpen: false,
    tasks:          [],
    preferences:    {},
    rawText:        '',

    draggedTask:       null,
    dragSourceColumn:  null,
    dropTarget:        null,
    dropBeforeId:      null,

    colDragSource:    null,
    colDropTarget:    null,
    tagOrder:         [],
    taskOrder:        {},
    boardPanning:     false,
    _colIndexMap:     {},

    listDraggedTask:  null,
    listDropBeforeId: null,

    listGroupBy:    'none',
    collapsedGroups: [],

    selectedTask:         null,
    modalOpen:            false,
    bodyText:             '',
    deleteConfirmPending: false,

    rawDraft:       '',
    rawEdited:      false,

    errorMsg:       '',

    // Auto-scroll state (drag)
    _dragPointerX:   null,
    _dragPointerY:   null,
    _dragColEl:      null,
    _stopAutoScroll: null,

    _externalUpdate: false,

    colCb:   { open: false, search: '' },
    groupCb: { open: false, search: '' },
    tagCb:   { open: false, search: '' },

    /* ── Computed: all unique tags (alphabetical) ── */
    get allTags() {
      const set = new Set();
      this.tasks.forEach(t => t.tags.forEach(tag => set.add(tag)));
      return [...set].sort();
    },

    /* ── Computed: tags sorted by tagOrder preference ── */
    get sortedAllTags() {
      const order = Array.isArray(this.tagOrder) ? this.tagOrder : [];
      const all = [...this.allTags];
      if (!order.length) return all;
      return all.sort((a, b) => {
        const ia = order.indexOf(a);
        const ib = order.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return a.localeCompare(b);
      });
    },

    /**
     * Ordered tag list for column/group display: tagOrder entries first (even if empty),
     * then task tags not yet in tagOrder. Used by columns getter and comboboxes.
     */
    get columnsTagList() {
      const order = Array.isArray(this.tagOrder) ? this.tagOrder : [];
      const taskTags = new Set(this.tasks.flatMap(t => t.tags));
      const extra = [...taskTags].filter(t => !order.includes(t)).sort();
      return [...order, ...extra];
    },

    /** Tags matching the current searchQuery, in columnsTagList order. */
    get searchSuggestions() {
      const q = this.searchQuery.toLowerCase().trim();
      const base = this.columnsTagList;
      if (!q) return base;
      return base.filter(t => t.includes(q));
    },

    /* ── Computed: tasks filtered by searchQuery only — newest first ── */
    get visibleTasks() {
      // Reverse so newest-inserted tasks appear first; exclude soft-deleted blank tasks
      let result = [...this.tasks].reverse().filter(t => t.raw !== '');

      if (this.searchQuery.trim()) {
        const q = this.searchQuery.toLowerCase();
        result = result.filter(t =>
          t.raw.toLowerCase().includes(q) ||
          (t.title && t.title.toLowerCase().includes(q))
        );
      }
      return result;
    },

    /* ── Computed: tasks filtered for kanban view (tagFilter + search) ── */
    get kanbanTasks() {
      let result = this.visibleTasks;
      const tf = this.tagFilter;

      if (tf === 'all') {
        result = result.filter(t => t.tags.length > 0);
      } else if (tf !== 'none') {
        const tags = Array.isArray(tf) ? tf : [tf];
        result = result.filter(t => tags.some(tag => t.tags.includes(tag)));
      }
      return result;
    },

    /* ── Computed: columns for Kanban view ── */
    get columns() {
      const tf = this.tagFilter;
      if (tf === 'none') {
        const ordered = this._orderedTasksForTag('', this.kanbanTasks);
        return ordered.length || this.kanbanTasks.length
          ? [{ tag: '', tasks: ordered }]
          : [];
      }
      const tags = tf === 'all' ? this.columnsTagList
                 : Array.isArray(tf) ? tf
                 : [tf];
      const cols = tags.map(tag => ({
        tag,
        tasks: this._orderedTasksForTag(tag, this.kanbanTasks.filter(t => t.tags.includes(tag))),
      }));

      // Decide whether to append the untagged column:
      // - If the database has no live tasks, always show an empty untagged column so users
      //   can add their first task — but never when "All tags" mode is active.
      // - Otherwise, show the untagged column only when there are untagged tasks and
      //   "All tags" mode is NOT active.
      const hasLiveTasks = this.tasks.some(t => t.raw !== '');
      if (!hasLiveTasks && tf !== 'all') {
        cols.push({ tag: '__untagged__', tasks: [] });
        return cols;
      }

      const untagged = this.visibleTasks.filter(t => t.tags.length === 0);
      if (untagged.length && tf !== 'all') {
        cols.push({ tag: '__untagged__', tasks: this._orderedTasksForTag('__untagged__', untagged) });
      }

      return cols;
    },

    /* ── Computed: grouped task list ── */
    get groupedList() {
      const lg = this.listGroupBy;
      if (lg === 'none') {
        return [{ group: '', tasks: this._orderedTasksForTag('', this.visibleTasks) }];
      }
      if (lg === 'all') {
        const result = [];
        const isSearching = Boolean(this.searchQuery && this.searchQuery.trim());
        for (const tag of this.columnsTagList) {
          const tasks = this._orderedTasksForTag(tag, this.visibleTasks.filter(t => t.tags.includes(tag)));
          // When searching, keep groups visible even if empty to preserve context.
          if (isSearching || tasks.length) result.push({ group: tag, tasks });
        }
        const untagged = this._orderedTasksForTag('__untagged__', this.visibleTasks.filter(t => t.tags.length === 0));
        if (isSearching || untagged.length) result.push({ group: 'untagged', tasks: untagged });
        return result;
      }
      const tags = Array.isArray(lg) ? lg : [lg];
      const tagSet = new Set(tags);
      const result = [];
      const isSearching = Boolean(this.searchQuery && this.searchQuery.trim());
      for (const tag of tags) {
        const tasks = this._orderedTasksForTag(tag, this.visibleTasks.filter(t => t.tags.includes(tag)));
        if (isSearching || tasks.length) result.push({ group: tag, tasks });
      }
      const untagged = this._orderedTasksForTag('__untagged__', this.visibleTasks.filter(t => !t.tags.some(tag => tagSet.has(tag))));
      if (isSearching || untagged.length) result.push({ group: 'untagged', tasks: untagged });
      return result;
    },

    /* ── Lifecycle ── */
    init() {
      this.rawText = loadFromStorage();
      const { tasks, preferences } = parseDatabase(this.rawText);
      this.tasks       = tasks;
      this.preferences = preferences;

      this._loadPreferences(preferences);
      this._applyTheme(this.theme);

      // Reactively reapply theme when it changes
      this.$watch('theme', val => this._applyTheme(val));

      // Persist UI preference changes back to the database file
      this.$watch('tagFilter',   val => { this.preferences.tagFilter   = val; this._saveDatabase(); });
      this.$watch('listGroupBy', val => { this.preferences.listGroupBy = val; this._saveDatabase(); });

      // Global error handlers — show error toast on unhandled errors
      window.onerror = (msg) => { this.errorMsg = String(msg); return false; };
      window.addEventListener('unhandledrejection', (e) => {
        this.errorMsg = e.reason?.message ?? String(e.reason);
      });

      // Multi-tab sync — reload when another tab writes to localStorage
      window.addEventListener('storage', (e) => {
        if (e.key !== STORAGE_KEY || e.newValue === null) return;
        this._reloadFromStorage(e.newValue);
      });

      // Track pointer position during any drag for auto-scroll
      document.addEventListener('dragover', this._onDocDragOver.bind(this));
    },

    /* ── Theme helpers ── */
    _applyTheme(val) {
      if (val === 'light')      document.documentElement.setAttribute('data-theme', 'light');
      else if (val === 'dark')  document.documentElement.setAttribute('data-theme', 'dark');
      else                      document.documentElement.removeAttribute('data-theme');
    },

    /** Restore UI state from a parsed preferences object. */
    _loadPreferences(preferences) {
      this.theme       = preferences.theme       ?? 'auto';
      this.tagFilter   = preferences.tagFilter   ?? 'all';
      this.listGroupBy = preferences.listGroupBy ?? 'none';
      this.tagOrder    = preferences.tagOrder    ?? [];
      this.taskOrder   = preferences.taskOrder   ?? {};
    },

    toggleTheme() {
      const cycle = { auto: 'light', light: 'dark', dark: 'auto' };
      this.theme = cycle[this.theme] ?? 'auto';
      this.preferences.theme = this.theme;
      this._saveDatabase();
    },

    /* ── View switching ── */
    switchToRaw() {
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
      this.currentView = 'raw';
    },

    /* ── Display helpers ── */
    displayTitle(task) {
      if (task.title) return task.title;
      return '(no title)';
    },

    snippet(task) {
      const body = extractBody(task.raw);
      const words = body.split(/\s+/).filter(Boolean);
      const text = words.slice(0, SNIPPET_WORDS).join(' ');
      return words.length > SNIPPET_WORDS ? text + '…' : text;
    },

    /* ── Tag color palette ── */
    tagHue(tag) {
      let h = 0;
      for (let i = 0; i < tag.length; i++) h = (h * 31 + tag.charCodeAt(i)) % 360;
      return Math.round(h / 30) * 30;
    },

    /** Select a tag suggestion: set search, close dropdown, scroll first matching task into view. */
    selectSearchSuggestion(tag) {
      this.searchQuery       = tag;
      this.searchSuggestOpen = false;
      this.$nextTick(() => {
        // Blur both search inputs so neither retains focus after a suggestion pick
        try { this.$refs?.searchInput?.blur(); } catch (e) {}
        try { this.$refs?.listSearchInput?.blur(); } catch (e) {}
        // In kanban view, scroll the matching column into view (suggestion = tag = column)
        if (this.currentView === 'kanban') {
          try {
            const colEl = document.querySelector(`.kanban-column[data-column-tag="${tag}"]`);
            if (colEl) colEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
          } catch (e) {}
        }
      });
    },

    /* ── Combobox helpers: Columns filter ── */
    colFilteredTags() {
      const s    = this.colCb.search.toLowerCase();
      const base = this.columnsTagList;
      return s ? base.filter(t => t.includes(s)) : base;
    },
    colIsSelected(tag) {
      const tf = this.tagFilter;
      return Array.isArray(tf) ? tf.includes(tag) : tf === tag;
    },
    colIsSpecial(val) {
      const tf = this.tagFilter;
      return !Array.isArray(tf) && tf === val;
    },
    colToggleTag(tag) {
      const tf = this.tagFilter;
      if (Array.isArray(tf)) {
        const next = tf.includes(tag) ? tf.filter(t => t !== tag) : [...tf, tag];
        this.tagFilter = next.length === 0 ? 'none' : next;
      } else if (tf === tag) {
        this.tagFilter = 'none';
      } else {
        this.tagFilter = [tag];
      }
    },
    colSetSpecial(val) {
      this.tagFilter  = val;
      this.colCb.open   = false;
      this.colCb.search = '';
    },
    colDisplayText() {
      const tf = this.tagFilter;
      if (tf === 'none') return 'None';
      if (tf === 'all') return 'All tags';
      if (Array.isArray(tf)) return tf.length === 1 ? tf[0] : `${tf.length} tags`;
      return tf;
    },

    /* ── Combobox helpers: Group by ── */
    groupFilteredTags() {
      const s    = this.groupCb.search.toLowerCase();
      const base = this.columnsTagList;
      return s ? base.filter(t => t.includes(s)) : base;
    },
    groupIsSelected(tag) {
      const lg = this.listGroupBy;
      return Array.isArray(lg) ? lg.includes(tag) : lg === tag;
    },
    groupIsSpecial(val) {
      const lg = this.listGroupBy;
      return !Array.isArray(lg) && lg === val;
    },
    groupToggleTag(tag) {
      const lg = this.listGroupBy;
      if (Array.isArray(lg)) {
        const next = lg.includes(tag) ? lg.filter(t => t !== tag) : [...lg, tag];
        this.listGroupBy = next.length === 0 ? 'none' : next;
      } else if (lg === tag) {
        this.listGroupBy = 'none';
      } else {
        this.listGroupBy = [tag];
      }
    },
    groupSetSpecial(val) {
      this.listGroupBy    = val;
      this.groupCb.open   = false;
      this.groupCb.search = '';
    },
    groupDisplayText() {
      const lg = this.listGroupBy;
      if (lg === 'none') return 'None';
      if (lg === 'all') return 'All tags';
      if (Array.isArray(lg)) return lg.length === 1 ? lg[0] : `${lg.length} tags`;
      return lg;
    },

    /* ── Combobox helpers: Task detail tags ── */
    tagCbFilteredTags() {
      // Use columnsTagList for consistent ordering with columns/group comboboxes
      const s = this.tagCb.search.toLowerCase();
      const existing = this.selectedTask?.tags ?? [];
      const base = this.columnsTagList;
      return s
        ? base.filter(t => t.includes(s) && !existing.includes(t))
        : base.filter(t => !existing.includes(t));
    },
    tagCbCommit() {
      const raw = this.tagCb.search.trim();
      if (!raw) return;
      // addTag normalizes raw input (lowercase, strip invalid chars) before appending
      this.addTag(this.selectedTask, raw);
      this.tagCb.search = '';
    },

    /* ── Persistence ── */
    _saveDatabase() {
      if (this._externalUpdate) return;
      // Ensure taskOrder is computed for all known tags before persisting
      const allTags = this.columnsTagList;
      const to = { ...(this.taskOrder || {}) };
      allTags.forEach(tag => {
        const tasksForTag = this.tasks.filter(t => t.tags.includes(tag));
        to[tag] = this._orderedTasksForTag(tag, tasksForTag).map(t => t.id);
      });
      // Ungtagged tasks
      const untaggedTasks = this.tasks.filter(t => !t.tags || t.tags.length === 0);
      if (untaggedTasks.length) to['__untagged__'] = this._orderedTasksForTag('__untagged__', untaggedTasks).map(t => t.id);
      this.taskOrder = to;
      this.preferences.taskOrder = to;
      this.rawText = serializeDatabase(this.tasks, this.preferences);
      saveToStorage(this.rawText);
    },

    /** Reload in-memory state from a raw text string (called on storage events from other tabs). */
    _reloadFromStorage(rawText) {
      this._externalUpdate = true;
      const { tasks, preferences } = parseDatabase(rawText);
      this.rawText     = rawText;
      this.tasks       = tasks;
      this.preferences = preferences;
      this._loadPreferences(preferences);
      this._applyTheme(this.theme);
      this._externalUpdate = false;
    },

    autosave() {
      clearTimeout(_autosaveTimer);
      _autosaveTimer = setTimeout(() => {
        this._saveDatabase();
      }, AUTOSAVE_DELAY);
    },

    /* ─────────────────────────────────────────────
       EXPORT / IMPORT
       ───────────────────────────────────────────── */

    exportFile() {
      const blob = new Blob([this.rawText], { type: 'text/plain; charset=utf-8' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'flat-kanban.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    },

    importFile(event) {
      const file = event.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        if (typeof text !== 'string') return;
        const { tasks, preferences } = parseDatabase(text);
        tasks.forEach(task => {
          task.raw = buildTaskRaw(task.title, task.tags, extractBody(task.raw));
        });
        this.tasks       = tasks;
        this.preferences = preferences;
        this._loadPreferences(preferences);
        const allParsedTags = [...new Set(tasks.flatMap(t => t.tags))];
        this._syncTagOrder(allParsedTags);
        this._saveDatabase();
        // Sync raw editor so the Raw view shows the freshly imported content
        this.rawDraft  = this.rawText;
        this.rawEdited = false;
      };
      reader.readAsText(file, 'utf-8');
      // Reset so same file can be re-imported
      event.target.value = '';
    },

    /* ─────────────────────────────────────────────
       RAW VIEW
       ───────────────────────────────────────────── */

    saveRaw() {
      const { tasks, preferences } = parseDatabase(this.rawDraft);
      tasks.forEach(task => {
        task.raw = buildTaskRaw(task.title, task.tags, extractBody(task.raw));
      });
      this.tasks       = tasks;
      this.preferences = preferences;
      this._loadPreferences(preferences);
      const allParsedTags = [...new Set(tasks.flatMap(t => t.tags))];
      this._syncTagOrder(allParsedTags);
      this._saveDatabase();
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
    },

    discardRaw() {
      this.rawDraft  = this.rawText;
      this.rawEdited = false;
    },

    /* ─────────────────────────────────────────────
       TASK DETAILS MODAL
       ───────────────────────────────────────────── */

    openTask(task) {
      // Blur search inputs so the board interaction takes focus
      try { this.$refs?.searchInput?.blur(); } catch (e) {}
      try { this.$refs?.listSearchInput?.blur(); } catch (e) {}
      this.searchSuggestOpen = false;
      this.selectedTask = task;
      this.bodyText     = extractBody(task.raw);
      this.tagCb.search = '';
      this.modalOpen    = true;
      this.$nextTick(() => {
        const selector = task.title ? '.modal-close-btn' : 'input, textarea, button';
        const modal = this.$refs.modal;
        if (modal) {
          const first = modal.querySelector(selector);
          if (first) first.focus();
        }
      });
    },

    closeTask() {
      if (this.selectedTask) {
        // Flush pending debounced edits before clearing state
        clearTimeout(_autosaveTimer);
        this.selectedTask.raw = buildTaskRaw(
          this.selectedTask.title,
          this.selectedTask.tags,
          this.bodyText
        );
        this._saveDatabase();
      }
      clearTimeout(_deleteTimer);
      this.deleteConfirmPending = false;
      this.modalOpen    = false;
      this.selectedTask = null;
      this.tagCb.search = '';
      this.tagCb.open   = false;
    },

    updateTitle(task, newTitle) {
      if (!task) return;
      const trimmed = newTitle.trim();
      task.title = trimmed || null;
      task.raw   = buildTaskRaw(task.title, task.tags, extractBody(task.raw));
      this.autosave();
    },

    updateBody(task, newBody) {
      if (!task) return;
      task.raw = buildTaskRaw(task.title, task.tags, newBody);
      this.autosave();
    },

    addTag(task, rawInput) {
      if (!task) return;
      const tag = rawInput.toLowerCase().replace(/[^a-z0-9_-]/g, '').trim();
      if (!tag || task.tags.includes(tag)) return;
      this._syncTagOrder([tag]);
      this._applyTagUpdate(task, [...task.tags, tag]);
    },

    removeTag(task, tag) {
      if (!task) return;
      this._applyTagUpdate(task, task.tags.filter(t => t !== tag));
    },

    deleteTask(task) {
      if (!task) return;
      if (!this.deleteConfirmPending) {
        this.deleteConfirmPending = true;
        _deleteTimer = setTimeout(() => { this.deleteConfirmPending = false; }, 3000);
        return;
      }
      clearTimeout(_deleteTimer);
      this.deleteConfirmPending = false;
      this.modalOpen    = false;
      this.selectedTask = null;
      this.tagCb.search = '';
      this.tagCb.open   = false;
      // Soft-delete: blank the raw block so indices remain stable across reloads.
      // The blank block is preserved in storage but not re-instantiated on parse.
      task.raw   = '';
      task.title = null;
      task.tags  = [];
      this._saveDatabase();
    },

    /** Basic focus trap: cycle Tab within the modal element. */
    trapFocus(event) {
      const modal    = this.$refs.modal;
      if (!modal) return;
      const focusable = [...modal.querySelectorAll(
        'button, input, textarea, select, [tabindex]:not([tabindex="-1"])'
      )].filter(el => !el.disabled);
      if (!focusable.length) return;
      const first = focusable[0];
      const last  = focusable[focusable.length - 1];
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    },

    /* ─────────────────────────────────────────────
       DRAG AUTO-SCROLL
       ───────────────────────────────────────────── */

    /** Called on every document dragover to track pointer position. */
    _onDocDragOver(e) {
      this._dragPointerX = e.clientX;
      this._dragPointerY = e.clientY;
    },

    /**
     * Start a rAF loop that scrolls the kanban board horizontally and the hovered column
     * vertically when the pointer is near the edges during a drag.
     * Returns a cancel function; store it in `this._stopAutoScroll`.
     */
    _startAutoScroll() {
      const EDGE = 80;  // px from edge to start scrolling
      const MAX  = 18;  // max px per frame
      let rafId  = null;

      const tick = () => {
        const board = this.$refs.kanbanBoard;
        const px    = this._dragPointerX;
        const py    = this._dragPointerY;

        if (board && px != null) {
          const br = board.getBoundingClientRect();
          if (px < br.left + EDGE && px >= br.left) {
            const ratio = 1 - (px - br.left) / EDGE;
            board.scrollLeft -= MAX * ratio;
          } else if (px > br.right - EDGE && px <= br.right) {
            const ratio = 1 - (br.right - px) / EDGE;
            board.scrollLeft += MAX * ratio;
          }
        }

        if (this._dragColEl && py != null) {
          const cards = this._dragColEl.querySelector('.kanban-cards');
          if (cards) {
            const cr = cards.getBoundingClientRect();
            if (py < cr.top + EDGE && py >= cr.top) {
              const ratio = 1 - (py - cr.top) / EDGE;
              cards.scrollTop -= MAX * ratio;
            } else if (py > cr.bottom - EDGE && py <= cr.bottom) {
              const ratio = 1 - (cr.bottom - py) / EDGE;
              cards.scrollTop += MAX * ratio;
            }
          }
        }

        rafId = requestAnimationFrame(tick);
      };

      rafId = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(rafId);
    },

    /* ─────────────────────────────────────────────
       KANBAN DRAG-AND-DROP
       ───────────────────────────────────────────── */

    dragStart(event, task, sourceTag) {
      this.draggedTask      = task;
      this.dragSourceColumn = sourceTag;
      this._dragColEl       = event.currentTarget.closest('.kanban-column');
      this._stopAutoScroll  = this._startAutoScroll();
      event.dataTransfer.effectAllowed = 'move';
      // Store task id so drop works even if state updates during drag
      event.dataTransfer.setData('text/plain', String(task.id));
    },

    dragOver(event, targetTag) {
      if (this.colDragSource !== null) return; // column drag in progress
      this.dropTarget   = targetTag;
      // Track current column element for vertical auto-scroll
      this._dragColEl = event.currentTarget.closest('.kanban-column');
    },

    dragLeave(event) {
      this.dropTarget = null;
    },

    dragEnd() {
      this._stopAutoScroll?.();
      this._stopAutoScroll = null;
      this._dragColEl      = null;
      this.draggedTask      = null;
      this.dragSourceColumn = null;
      this.dropTarget       = null;
      this.dropBeforeId     = null;
    },

    dropOnColumn(event, targetTag) {
      // Ignore drops initiated by column header drags
      if (this.colDragSource !== null) return;

      const taskId = parseInt(event.dataTransfer.getData('text/plain'), 10);
      const task   = this.tasks.find(t => t.id === taskId);
      this.dropTarget = null;

      if (!task) { this.dropBeforeId = null; this.dragEnd(); return; }

      if (targetTag === '') {
        // Flat mode ("None" column): reorder via taskOrder preference, not tasks array
        const col     = this.columns.find(c => c.tag === '');
        const ordered = col ? [...col.tasks] : [];
        const srcIdx  = ordered.findIndex(t => t.id === task.id);
        if (srcIdx !== -1) ordered.splice(srcIdx, 1);
        const beforeIdx = this.dropBeforeId !== null
          ? ordered.findIndex(t => t.id === this.dropBeforeId)
          : -1;
        if (beforeIdx >= 0) ordered.splice(beforeIdx, 0, task);
        else ordered.push(task);
        this._applyTaskOrder('', ordered);
        this.dropBeforeId = null;
        this.autosave();
        this.dragEnd();
        return;
      }

      const sourceTag = this.dragSourceColumn;
      if (targetTag === sourceTag) {
        // Reordering within the same column: compute new order and apply if changed.
        const col = this.columns.find(c => c.tag === targetTag);
        if (col) {
          const ordered = [...col.tasks];
          const srcIdx = ordered.findIndex(t => t.id === task.id);
          if (srcIdx !== -1) ordered.splice(srcIdx, 1);
          const bi = ordered.findIndex(t => t.id === this.dropBeforeId);
          if (this.dropBeforeId !== null && bi >= 0) ordered.splice(bi, 0, task);
          else ordered.push(task);
          // If order unchanged, do nothing
          const origIds = (col.tasks || []).map(t => t.id);
          const newIds = ordered.map(t => t.id);
          const same = origIds.length === newIds.length && origIds.every((v,i) => v === newIds[i]);
          if (!same) {
            this._applyTaskOrder(targetTag, ordered);
            this.autosave();
          }
        }
        this.dragEnd();
        return;
      }

      // Untagged column: remove source tag, don't add any new tag
      if (targetTag === '__untagged__') {
        const newTags = task.tags.filter(t => t !== sourceTag);
        this._applyTagUpdate(task, newTags);
        // Update taskOrder for untagged column if dropBeforeId is set
        if (this.dropBeforeId !== null) {
          const col     = this.columns.find(c => c.tag === '__untagged__');
          const ordered = col ? [...col.tasks] : [];
          const s = ordered.findIndex(t => t.id === task.id);
          if (s !== -1) ordered.splice(s, 1);
          const bi = ordered.findIndex(t => t.id === this.dropBeforeId);
          if (bi >= 0) ordered.splice(bi, 0, task); else ordered.push(task);
          this._applyTaskOrder('__untagged__', ordered);
        }
        this.dragEnd();
        return;
      }

      // Add target column tag (skip empty tags from "None" column)
      let newTags = task.tags.filter(t => t !== sourceTag);
      if (targetTag && !newTags.includes(targetTag)) newTags = [...newTags, targetTag];
      this._applyTagUpdate(task, newTags);

      // Update taskOrder for target tag considering dropBeforeId position
      this.$nextTick(() => {
        const col = this.columns.find(c => c.tag === targetTag);
        if (col && this.dropBeforeId !== null) {
          const ordered = [...col.tasks];
          const s = ordered.findIndex(t => t.id === task.id);
          if (s !== -1) ordered.splice(s, 1);
          const bi = ordered.findIndex(t => t.id === this.dropBeforeId);
          if (bi >= 0) ordered.splice(bi, 0, task); else ordered.push(task);
          this._applyTaskOrder(targetTag, ordered);
        } else if (col) {
          this._applyTaskOrder(targetTag, col.tasks);
        }
      });
      this.dragEnd();
    },

    /** Central helper that rebuilds a task's raw block after a tag/title change. */
    _applyTagUpdate(task, newTags) {
      const body    = extractBody(task.raw);
      task.raw      = buildTaskRaw(task.title, newTags, body);
      task.tags     = newTags;
      this.autosave();
    },

    /**
     * Return `tasks` reordered according to `taskOrder[tag]`.
     * Tasks listed in the stored order come first; unlisted tasks are appended.
     */
    _orderedTasksForTag(tag, tasks) {
      const order = this.taskOrder[tag] ?? [];
      if (!order.length) return tasks;
      const map      = Object.fromEntries(tasks.map(t => [t.id, t]));
      const listed   = order.map(id => map[id]).filter(Boolean);
      const listedIds = new Set(order);
      const unlisted = tasks.filter(t => !listedIds.has(t.id));
      return [...listed, ...unlisted];
    },

    /** Persist the given ordered task list as `taskOrder[tag]`. */
    _applyTaskOrder(tag, tasks) {
      const o = { ...this.taskOrder };
      o[tag]  = tasks.map(t => t.id);
      this.taskOrder             = o;
      this.preferences.taskOrder = o;
    },

    /** Append any candidateTags not yet in tagOrder (sorted). */
    _syncTagOrder(candidateTags) {
      const order = Array.isArray(this.tagOrder) ? this.tagOrder : [];
      const added = candidateTags.filter(t => !order.includes(t)).sort();
      if (!added.length) return;
      this.tagOrder             = [...order, ...added];
      this.preferences.tagOrder = this.tagOrder;
      // Ensure taskOrder entries exist for new tags
      const to = { ...this.taskOrder };
      let changed = false;
      added.forEach(t => { if (!(t in to)) { to[t] = []; changed = true; } });
      if (changed) {
        this.taskOrder             = to;
        this.preferences.taskOrder = to;
      }
    },

    addTaskToColumn(tag) {
      const newId = this.tasks.length ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
      // Empty tag or untagged sentinel means no tags
      const tags  = (tag && tag !== '__untagged__') ? [tag] : [];
      const raw   = buildTaskRaw(null, tags, '');
      const task  = { id: newId, raw, title: null, tags };
      this.tasks.push(task);
      this.autosave();
      this.openTask(task);
    },

    addTaskToList() {
      const newId = this.tasks.length ? Math.max(...this.tasks.map(t => t.id)) + 1 : 1;
      const raw   = buildTaskRaw(null, [], '');
      const task  = { id: newId, raw, title: null, tags: [] };
      this.tasks.push(task);
      this.autosave();
      this.openTask(task);
    },

    /** Add task inside a list-group (group.group values: tag string or 'untagged' or '') */
    addTaskToGroup(groupKey) {
      if (!groupKey) {
        this.addTaskToList();
        return;
      }
      if (groupKey === 'untagged') {
        this.addTaskToColumn('__untagged__');
        return;
      }
      this.addTaskToColumn(groupKey);
    },

    /* ─────────────────────────────────────────────
       FLAT CARD DRAG (position in column)
       ───────────────────────────────────────────── */

    /** Per-card dragover for the flat "None" column — computes dropBeforeId. */
    flatCardDragOver(event, task, colTag) {
      if (colTag !== '') return; // only in flat column
      const rect = event.currentTarget.getBoundingClientRect();
      if (event.clientY < rect.top + rect.height / 2) {
        this.dropBeforeId = task.id;
      } else {
        const idx  = this.visibleTasks.findIndex(t => t.id === task.id);
        const next = this.visibleTasks[idx + 1];
        this.dropBeforeId = next ? next.id : null;
      }
    },

    /** Dragover on the kanban-cards area below all cards in flat column — clears dropBeforeId. */
    flatBoardDragOver(event) {
      if (this.colDragSource !== null) return; // column drag in progress
      // Only clear when dragging over the empty area itself, not a child card
      if (event && event.target !== event.currentTarget) return;
      this.dropBeforeId = null;
    },

    /* ─────────────────────────────────────────────
       COLUMN REORDER DRAG
       ───────────────────────────────────────────── */

    colHeaderDragStart(event, tag) {
      this.colDragSource    = tag;
      this._dragColEl       = null; // no column scroll during column reorder
      this._colIndexMap     = Object.fromEntries(this.columns.map((c, i) => [c.tag, i]));
      // Precompute column header centers (measured once at drag start) to avoid
      // frequent getBoundingClientRect calls on every dragover event.
      try {
        this._colCenters = {};
        const headers = this.$refs.kanbanBoard ? this.$refs.kanbanBoard.querySelectorAll('.kanban-column-header') : [];
        headers.forEach(h => {
          const colEl = h.closest('.kanban-column');
          const tagAttr = colEl ? colEl.getAttribute('data-column-tag') : '';
          const r = h.getBoundingClientRect();
          this._colCenters[tagAttr] = r.left + r.width / 2;
        });
      } catch (e) { this._colCenters = null; }
      this._stopAutoScroll  = this._startAutoScroll();
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', `col:${tag}`);
    },

    colHeaderDragOver(event, tag) {
      if (this.colDragSource == null) return;
      // Use precomputed centers if available for better performance
      const center = this._colCenters?.[tag] ?? null;
      if (center !== null) {
        if (event.clientX < center) this.colDropTarget = tag;
        else {
          const idx  = this._colIndexMap[tag] ?? -1;
          const cols = this.columns;
          const next = idx >= 0 ? cols[idx + 1] : null;
          this.colDropTarget = next ? next.tag : tag;
        }
      } else {
        const rect = event.currentTarget.getBoundingClientRect();
        if (event.clientX < rect.left + rect.width / 2) this.colDropTarget = tag;
        else {
          const idx  = this._colIndexMap[tag] ?? -1;
          const cols = this.columns;
          const next = idx >= 0 ? cols[idx + 1] : null;
          this.colDropTarget = next ? next.tag : tag;
        }
      }
    },

    colHeaderDrop(event, tag) {
      this._stopAutoScroll?.();
      this._stopAutoScroll = null;
      const src = this.colDragSource;
      // Use the computed colDropTarget (if any) as the actual destination.
      const dst = this.colDropTarget ?? tag;
      this.colDragSource = null;
      this.colDropTarget = null;
      if (!src || src === dst) return;

      const ordered = [...this.sortedAllTags];
      const srcIdx  = ordered.indexOf(src);
      const dstIdx  = ordered.indexOf(dst);
      if (srcIdx === -1 || dstIdx === -1) return;

      ordered.splice(srcIdx, 1);
      ordered.splice(dstIdx, 0, src);
      this.tagOrder             = ordered;
      this.preferences.tagOrder = ordered;
      this._saveDatabase();
    },

    colHeaderDragEnd() {
      this._stopAutoScroll?.();
      this._stopAutoScroll = null;
      this.colDragSource = null;
      this.colDropTarget = null;
      this._colCenters = null;
    },

    /** Clear column drop indicator when pointer truly leaves a column during column drag. */
    colColumnDragLeave(event) {
      if (!event.currentTarget.contains(event.relatedTarget)) {
        this.colDropTarget = null;
      }
    },

    /* ─────────────────────────────────────────────
       KANBAN BOARD HORIZONTAL SCROLL (mouse-hold + wheel)
       ───────────────────────────────────────────── */

    boardMouseDown(event) {
      // Do not intercept clicks on interactive elements or draggable column headers
      if (event.target.closest('.task-card, button, input, textarea, a, select, [draggable="true"]')) return;
      if (event.button !== 0) return;

      // When interacting with the board, blur the global search input and close suggestions
      try {
        if (this.$refs?.searchInput) {
          this.$refs.searchInput.blur();
          this.searchSuggestOpen = false;
        }
      } catch (e) { /* defensive: ignore if refs unavailable */ }

      const board     = this.$refs.kanbanBoard;
      const startX    = event.pageX;
      const startLeft = board.scrollLeft;
      let lastX       = event.pageX;
      let velocity    = 0;
      this.boardPanning = true;

      const onMove = (e) => {
        velocity         = e.pageX - lastX;
        lastX            = e.pageX;
        board.scrollLeft = startLeft - (e.pageX - startX);
      };
      const onUp = () => {
        this.boardPanning = false;
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup',   onUp);
        // Inertia: keep scrolling with exponential decay after release
        let v = -velocity;
        const animate = () => {
          if (Math.abs(v) < 0.5) return;
          board.scrollLeft += v;
          v *= 0.92;
          requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup',   onUp);
      event.preventDefault();
    },

    /** Translate vertical wheel events into horizontal board scroll. */
    boardWheelScroll(event) {
      if (event.deltaY === 0) return;
      // If the pointer is over a vertically scrollable column, let it scroll normally
      if (event.target.closest('.kanban-cards')) return;
      event.preventDefault();
      this.$refs.kanbanBoard.scrollLeft += event.deltaY;
    },

    /* ─────────────────────────────────────────────
       LIST ROW DRAG (reorder per group / flat)
       ───────────────────────────────────────────── */

    listRowDragStart(event, task, group) {
      this.listDraggedTask  = task;
      this._listDragGroup   = group ?? '';
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', String(task.id));
    },

    listRowDragOver(event, task, group) {
      if (this.listDraggedTask == null) return;
      // Only allow reorder within the same group
      if ((group ?? '') !== (this._listDragGroup ?? '')) return;
      const rect = event.currentTarget.getBoundingClientRect();
      if (event.clientY < rect.top + rect.height / 2) {
        this.listDropBeforeId = task.id;
      } else {
        // Find next task in the same group
        const grp  = this.groupedList.find(g => (g.group || '') === (group || ''));
        const list = grp ? grp.tasks : this.visibleTasks;
        const idx  = list.findIndex(t => t.id === task.id);
        const next = list[idx + 1];
        this.listDropBeforeId = next ? next.id : -1;
      }
    },

    listRowDrop(group) {
      if (this.listDropBeforeId === null) return;
      const task = this.listDraggedTask;
      if (!task) return;

      const groupKey = group ?? '';
      const grp      = this.groupedList.find(g => (g.group || '') === groupKey);
      const ordered  = grp ? [...grp.tasks] : [...this.visibleTasks];
      const originalIds = (grp ? grp.tasks : this.visibleTasks).map(t => t.id);

      const srcIdx = ordered.findIndex(t => t.id === task.id);
      if (srcIdx !== -1) ordered.splice(srcIdx, 1);
      const beforeIdx = this.listDropBeforeId !== null && this.listDropBeforeId !== -1
        ? ordered.findIndex(t => t.id === this.listDropBeforeId)
        : -1;
      if (beforeIdx >= 0) ordered.splice(beforeIdx, 0, task);
      else ordered.push(task);

      const newIds = ordered.map(t => t.id);
      // If ordering didn't actually change (self-drop), do nothing.
      const same = originalIds.length === newIds.length && originalIds.every((v,i) => v === newIds[i]);
      if (same) {
        this.listDraggedTask  = null;
        this.listDropBeforeId = null;
        this._listDragGroup   = null;
        return;
      }

      // Map group key to taskOrder key
      const orderKey = groupKey === 'untagged' ? '__untagged__' : groupKey;
      this._applyTaskOrder(orderKey, ordered);
      this.listDraggedTask  = null;
      this.listDropBeforeId = null;
      this._listDragGroup   = null;
      this.autosave();
    },

    /* ─────────────────────────────────────────────
       LIST VIEW HELPERS
       ───────────────────────────────────────────── */

    toggleGroup(group) {
      if (this.collapsedGroups.includes(group)) {
        this.collapsedGroups = this.collapsedGroups.filter(g => g !== group);
      } else {
        this.collapsedGroups = [...this.collapsedGroups, group];
      }
    },
  };
}
</script>
</body>
</html>
