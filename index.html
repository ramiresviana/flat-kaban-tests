<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flat Kanban</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234a7cf7' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><rect x='3' y='3' width='7' height='18' rx='1'/><rect x='14' y='3' width='7' height='11' rx='1'/></svg>" />

  <!-- Inter typeface ─ display=swap avoids FOIT -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Feather Icons — lightweight SVG icon set -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons@4.29.2/dist/feather.min.js"></script>

  <!-- Alpine.js v3 — deferred so x-data is ready before DOMContentLoaded -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>

  <style>
    /* ─────────────────────────────────────────────
       DESIGN TOKENS  (light scheme defaults)
       ───────────────────────────────────────────── */
    :root {
      /* Surface palette */
      --bg:           #f4f5f7;
      --surface:      #ffffff;
      --surface-2:    #eef0f3;
      --border:       #d8dce3;
      --border-focus: #5a8dee;

      /* Text */
      --text:         #1a1d23;
      --text-2:       #5a6070;
      --text-3:       #8f96a3;

      /* Accent */
      --accent:       #4a7cf7;
      --accent-hi:    #3567e8;
      --accent-dim:   #dce9ff;

      /* Semantic */
      --danger:       #e05252;
      --success:      #3cb87a;

      /* Spacing scale (0.25 rem steps) */
      --s1: 0.25rem;
      --s2: 0.5rem;
      --s3: 0.75rem;
      --s4: 1rem;
      --s5: 1.5rem;
      --s6: 2rem;

      /* Radii */
      --r1: 4px;
      --r2: 8px;
      --r3: 12px;

      /* Shadows */
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
      --shadow-md: 0 4px 12px rgba(0,0,0,.12);

      /* Transitions */
      --ease: 140ms ease;

      /* Typography */
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* ─────────────────────────────────────────────
       DARK SCHEME  (set via data-theme="dark" on <html>)
       ───────────────────────────────────────────── */
    [data-theme="dark"] {
      --bg:           #13151a;
      --surface:      #1e2029;
      --surface-2:    #272a35;
      --border:       #343847;
      --border-focus: #5a8dee;

      --text:         #e8eaf0;
      --text-2:       #9aa0b4;
      --text-3:       #5c6278;

      --accent:       #5a8dee;
      --accent-hi:    #6f9ef4;
      --accent-dim:   #1a2540;

      --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
      --shadow-md: 0 4px 12px rgba(0,0,0,.4);
    }

    /* Auto dark — defers to OS when no manual override is set */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg:           #13151a;
        --surface:      #1e2029;
        --surface-2:    #272a35;
        --border:       #343847;
        --border-focus: #5a8dee;

        --text:         #e8eaf0;
        --text-2:       #9aa0b4;
        --text-3:       #5c6278;

        --accent:       #5a8dee;
        --accent-hi:    #6f9ef4;
        --accent-dim:   #1a2540;

        --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
        --shadow-md: 0 4px 12px rgba(0,0,0,.4);
      }
    }

    /* ─────────────────────────────────────────────
       RESET & BASE
       ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font: inherit;
      color: inherit;
    }

    a { color: var(--accent); text-decoration: none; }

    /* ─────────────────────────────────────────────
       APP LAYOUT  (flex column, full viewport)
       ───────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    #header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: 0 var(--s5);
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .header-logo {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      margin-right: var(--s3);
      display: flex;
      align-items: center;
      gap: var(--s2);
    }

    .header-logo svg { color: var(--accent); }

    /* View tabs */
    .view-tabs {
      display: flex;
      gap: var(--s1);
      background: var(--surface-2);
      border-radius: var(--r2);
      padding: var(--s1);
    }

    .view-tab {
      padding: var(--s1) var(--s3);
      border: none;
      background: transparent;
      border-radius: var(--r1);
      cursor: pointer;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      transition: background var(--ease), color var(--ease);
    }

    .view-tab:hover { background: var(--border); color: var(--text); }
    .view-tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow-sm); }

    /* Header spacer */
    .header-spacer { flex: 1; }

    /* Icon button (theme toggle, export, import) */
    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--r1);
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      transition: background var(--ease), color var(--ease);
    }

    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .icon-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    /* ─── MAIN CONTENT ─── */
    #main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── SUB-HEADER (shared layout) ── */
    #subheader, #list-subheader {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .filter-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-2);
      white-space: nowrap;
    }

    .filter-select {
      padding: var(--s1) var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
      cursor: pointer;
      min-width: 120px;
    }

    .filter-select:focus { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    .search-input {
      flex: 1;
      max-width: 280px;
      padding: var(--s1) var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
    }

    .search-input::placeholder { color: var(--text-3); }
    .search-input:focus { outline: 2px solid var(--border-focus); outline-offset: 2px; border-color: transparent; }

    /* Search suggestion dropdown */
    .search-wrap { position: relative; flex: 1; max-width: 280px; }
    .search-wrap .search-input { width: 100%; max-width: unset; }

    .search-suggest-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      z-index: 60;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      box-shadow: var(--shadow-md);
      max-height: 200px;
      overflow-y: auto;
    }

    .search-suggest-item {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: var(--s2) var(--s3);
      font-size: 0.8125rem;
      cursor: pointer;
      user-select: none;
    }

    .search-suggest-item:hover { background: var(--surface-2); }

    /* ─── VIEW PANELS ─── */
    .view-panel {
      flex: 1;
      overflow: auto;
      padding: var(--s5);
    }

    /* Kanban panel handles its own padding via .kanban-board */
    .view-panel.kanban-panel {
      padding: 0;
      overflow: hidden;
    }

    /* ─────────────────────────────────────────────
       UTILITY CLASSES
       ───────────────────────────────────────────── */
    [x-cloak] { display: none !important; }

    .sr-only {
      position: absolute; width: 1px; height: 1px;
      padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    /* Placeholder panel while views load */
    .placeholder-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      font-size: 0.875rem;
    }

    /* Kanban view wants full-height placeholder; scope the full-height there only */
    .view-panel.kanban-panel .placeholder-panel {
      height: 100%;
    }

    /* ─────────────────────────────────────────────
       KANBAN BOARD
       ───────────────────────────────────────────── */
    .kanban-board {
      display: flex;
      gap: var(--s4);
      height: 100%;
      align-items: flex-start;
      overflow-x: auto;
      padding: var(--s5);
      padding-bottom: calc(var(--s5) + var(--s4));
    }

    .kanban-column {
      flex-shrink: 0;
      width: 284px;
      background: var(--surface);
      border-radius: var(--r3);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 100%;
      box-shadow: var(--shadow-sm);
    }

    .kanban-column-header {
      padding: var(--s2) var(--s4);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--s2);
      position: relative;
    }

    /* Column header drag handle — replaces counter on hover */
    .column-count { transition: opacity var(--ease); }
    .kanban-column-header:hover .column-count { opacity: 0; }
    .column-drag-handle {
      position: absolute;
      right: var(--s4);
      color: var(--text);
      opacity: 0;
      transition: opacity var(--ease);
      line-height: 0;
      cursor: grab;
    }
    .kanban-column-header:hover .column-drag-handle { opacity: 1; }

    .column-tag-name {
      font-weight: 600;
      font-size: 0.8125rem;
      text-transform: capitalize;
      color: hsl(var(--tag-hue, 214), 60%, 40%);
    }

    [data-theme="dark"] .column-tag-name {
      color: hsl(var(--tag-hue, 214), 70%, 65%);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .column-tag-name {
        color: hsl(var(--tag-hue, 214), 70%, 65%);
      }
    }

    .column-count {
      font-size: 0.75rem;
      font-weight: 500;
      background: var(--surface-2);
      color: var(--text-2);
      padding: 1px 7px;
      border-radius: 999px;
      min-width: 20px;
      text-align: center;
    }

    .kanban-cards {
      flex: 1;
      overflow-y: auto;
      padding: var(--s3);
      display: flex;
      flex-direction: column;
      gap: var(--s2);
      min-height: 80px;
      border-radius: 0 0 var(--r3) var(--r3);
      transition: background var(--ease);
    }

    .kanban-cards.dragover {
      background: var(--accent-dim);
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
    }

    /* Task card */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      padding: var(--s3) var(--s4);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--ease), border-color var(--ease), opacity var(--ease);
      user-select: none;
    }

    .task-card:hover {
      border-color: var(--border-focus);
      box-shadow: var(--shadow-md);
    }

    .task-card:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .task-card.dragging { opacity: 0.35; }

    /* Drag handle — top-right of card, visible on hover */
    .task-card { position: relative; }
    .task-card-drag-handle {
      position: absolute;
      top: var(--s2);
      right: var(--s2);
      color: var(--text);
      opacity: 0;
      transition: opacity var(--ease);
      line-height: 0;
      cursor: grab;
    }
    .task-card:hover .task-card-drag-handle { opacity: 1; }

    .task-card-title {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: var(--s1);
      line-height: 1.4;
    }

    .task-card-snippet {
      font-size: 0.8125rem;
      color: var(--text-2);
      line-height: 1.4;
      margin-bottom: var(--s2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .task-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s1);
    }

    .tag-chip {
      font-size: 0.6875rem;
      font-weight: 500;
      padding: 1px 7px;
      border-radius: 999px;
      background: hsl(var(--tag-hue, 214), 70%, 92%);
      color: hsl(var(--tag-hue, 214), 60%, 32%);
    }

    [data-theme="dark"] .tag-chip {
      background: hsl(var(--tag-hue, 214), 40%, 22%);
      color: hsl(var(--tag-hue, 214), 70%, 72%);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .tag-chip {
        background: hsl(var(--tag-hue, 214), 40%, 22%);
        color: hsl(var(--tag-hue, 214), 70%, 72%);
      }
    }

    .column-empty {
      text-align: center;
      color: var(--text-3);
      font-size: 0.8125rem;
      padding: var(--s5) var(--s4);
      border: 1px dashed var(--border);
      border-radius: var(--r2);
    }

    /* Add-task button inside column */
    .add-task-btn {
      display: flex;
      align-items: center;
      gap: var(--s2);
      width: 100%;
      padding: var(--s2) var(--s4);
      border: none;
      border-top: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-size: 0.8125rem;
      color: var(--text-3);
      border-radius: 0 0 var(--r3) var(--r3);
      transition: background var(--ease), color var(--ease);
    }

    .add-task-btn:hover { background: var(--surface-2); color: var(--accent); }
    .add-task-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: -2px; }

    /* ─────────────────────────────────────────────
       LIST VIEW
       ───────────────────────────────────────────── */
    .list-view {
      display: flex;
      flex-direction: column;
      gap: var(--s4);
    }

    .list-section { /* one per group */
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      overflow: hidden;
    }

    .list-group-header {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: var(--s2) var(--s4);
      background: var(--surface-2);
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      user-select: none;
      font-weight: 600;
      font-size: 0.8125rem;
    }

    .list-group-header:hover { background: var(--border); }

    .group-tag-name[style] {
      color: hsl(var(--tag-hue, 214), 60%, 40%);
    }

    [data-theme="dark"] .group-tag-name[style] {
      color: hsl(var(--tag-hue, 214), 70%, 65%);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .group-tag-name[style] {
        color: hsl(var(--tag-hue, 214), 70%, 65%);
      }
    }

    .group-chevron {
      transition: transform var(--ease);
      color: var(--text-3);
      flex-shrink: 0;
    }

    .group-chevron.collapsed { transform: rotate(-90deg); }

    .group-count {
      font-weight: 400;
      font-size: 0.75rem;
      color: var(--text-3);
      margin-left: auto;
    }

    .list-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    /* List row drag handle — prepended to title, visible on hover */
    .list-drag-handle {
      display: inline-flex;
      color: var(--text);
      opacity: 0;
      transition: opacity var(--ease);
      vertical-align: top;
      cursor: grab;
    }
    .list-table tr:hover .list-drag-handle { opacity: 1; }

    .list-table th:nth-child(1) { width: 28%; }
    .list-table th:nth-child(2) { width: 52%; }
    .list-table th:nth-child(3) { width: 20%; }

    .list-table th {
      padding: var(--s2) var(--s4);
      text-align: left;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
      white-space: nowrap;
    }

    /* Reserve left space in the first header column to match hidden row drag handle.
       Body cell: padding-left(var(--s4)=16px) + drag handle SVG(18px) = 34px total. */
    .list-table th:first-child { padding-left: calc(var(--s4) + 18px); }

    .list-table td {
      padding: var(--s2) var(--s4);
      font-size: 0.8125rem;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .list-table tr:last-child td { border-bottom: none; }

    .list-table tr:hover td { background: var(--surface-2); cursor: pointer; }

    .list-title-cell {
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-snippet-cell {
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-tags-cell {
      white-space: nowrap;
      min-width: 80px;
    }

    .list-tags-cell .tag-chip { margin-right: 3px; }

    /* Add-task row inside list table — last row of each group */
    .list-add-row td {
      padding: var(--s2) var(--s4);
      color: var(--text-3);
      font-size: 0.8125rem;
      cursor: pointer;
      border-bottom: none;
    }
    .list-add-row:hover td { background: var(--surface-2); color: var(--accent); }
    .list-add-row td span { display: inline-flex; align-items: center; gap: var(--s2); }

    /* Empty-state row inside list table */
    .list-empty-row td {
      padding: var(--s4) var(--s4);
      color: var(--text-3);
      font-size: 0.8125rem;
      text-align: center;
      border-bottom: none;
    }

    /* ─────────────────────────────────────────────
       TASK DETAILS MODAL
       ───────────────────────────────────────────── */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 100;
      backdrop-filter: blur(2px);
    }

    .modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 101;
      width: min(1200px, calc(100vw - 2 * var(--s5)));
      height: min(800px, calc(100vh - 2 * var(--s5)));
      max-height: calc(100vh - 4 * var(--s5));
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r3);
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-body-section-grow {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 120px;
    }

    .modal-header {
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s4) var(--s5);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title-input {
      flex: 1;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      padding: 0;
      line-height: 1.4;
    }

    .modal-title-input::placeholder { color: var(--text-3); font-weight: 400; }
    .modal-title-input:focus { border-bottom: 2px solid var(--border-focus); }

    .modal-close-btn {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: none;
      border-radius: var(--r1);
      background: transparent;
      cursor: pointer;
      color: var(--text-2);
      font-size: 1rem;
      transition: background var(--ease), color var(--ease);
    }

    .modal-close-btn:hover { background: var(--surface-2); color: var(--text); }
    .modal-close-btn:focus-visible { outline: 2px solid var(--border-focus); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--s4) var(--s5);
      display: flex;
      flex-direction: column;
      gap: var(--s4);
    }

    /* Tag editor */
    .modal-section-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-3);
      margin-bottom: var(--s2);
    }

    .tag-editor {
      display: flex;
      flex-wrap: wrap;
      gap: var(--s1);
      align-items: center;
      padding: var(--s2);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      min-height: 38px;
      background: var(--surface-2);
      cursor: text;
    }

    .tag-editor:focus-within { border-color: var(--border-focus); background: var(--surface); }

    .tag-chip-removable {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 4px 2px 8px;
      border-radius: 999px;
      background: hsl(var(--tag-hue, 214), 70%, 92%);
      color: hsl(var(--tag-hue, 214), 60%, 32%);
    }

    [data-theme="dark"] .tag-chip-removable {
      background: hsl(var(--tag-hue, 214), 40%, 22%);
      color: hsl(var(--tag-hue, 214), 70%, 72%);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) .tag-chip-removable {
        background: hsl(var(--tag-hue, 214), 40%, 22%);
        color: hsl(var(--tag-hue, 214), 70%, 72%);
      }
    }

    .tag-remove-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border: none;
      border-radius: 50%;
      background: transparent;
      cursor: pointer;
      color: currentColor;
      font-size: 0.75rem;
      padding: 0;
      transition: background var(--ease);
    }

    .tag-remove-btn:hover { background: hsl(var(--tag-hue, 214), 55%, 40%); color: #fff; }

    .tag-add-input {
      flex: 1;
      min-width: 100px;
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.8125rem;
      color: var(--text);
      padding: 2px 0;
    }

    .tag-add-input::placeholder { color: var(--text-3); }

    /* Body textarea */
    .modal-body-textarea {
      flex: 1;
      width: 100%;
      min-height: 200px;
      resize: none;
      padding: var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.875rem;
      line-height: 1.6;
      font-family: var(--font);
    }

    .modal-body-textarea:focus {
      outline: none;
      border-color: var(--border-focus);
      background: var(--surface);
    }

    /* Modal footer (delete button) */
    .modal-footer {
      padding: var(--s3) var(--s5);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .btn-danger {
      padding: var(--s1) var(--s4);
      border: 1px solid var(--danger);
      border-radius: var(--r1);
      background: transparent;
      color: var(--danger);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }

    .btn-danger:focus-visible { outline: 2px solid var(--danger); outline-offset: 2px; }
    .btn-danger-confirm { background: var(--danger); color: #fff; }

    /* ─────────────────────────────────────────────
       RAW VIEW
       ───────────────────────────────────────────── */
    .raw-view {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .raw-toolbar {
      display: flex;
      align-items: center;
      gap: var(--s3);
      padding: var(--s2) var(--s5);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .unsaved-badge {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent-dim);
      color: var(--accent);
    }

    .btn-primary {
      padding: var(--s1) var(--s4);
      border: 1px solid var(--accent);
      border-radius: var(--r1);
      background: var(--accent);
      color: #fff;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--ease);
    }

    .btn-primary:hover { background: var(--accent-hi); }
    .btn-primary:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }
    .btn-primary:disabled { opacity: 0.45; cursor: default; }

    .btn-secondary {
      padding: var(--s1) var(--s4);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: transparent;
      color: var(--text-2);
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--ease), color var(--ease);
    }

    .btn-secondary:hover { background: var(--surface-2); color: var(--text); }
    .btn-secondary:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    .raw-editor {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      padding: var(--s5);
      background: var(--bg);
      color: var(--text);
      font-family: 'Menlo', 'Consolas', 'Liberation Mono', monospace;
      font-size: 0.8125rem;
      line-height: 1.7;
      tab-size: 2;
    }



    /* ─────────────────────────────────────────────
       COMBOBOX
       ───────────────────────────────────────────── */
    .combobox-wrap {
      position: relative;
    }

    .combobox-btn {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: var(--s1) var(--s3);
      border: 1px solid var(--border);
      border-radius: var(--r1);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
      cursor: pointer;
      min-width: 130px;
      justify-content: space-between;
      transition: border-color var(--ease);
    }

    .combobox-btn:hover { border-color: var(--border-focus); }
    .combobox-btn:focus-visible { outline: 2px solid var(--border-focus); outline-offset: 2px; }

    .combobox-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      z-index: 50;
      min-width: 190px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r2);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      max-height: 300px;
      display: flex;
      flex-direction: column;
    }

    .combobox-search-row {
      padding: var(--s2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .combobox-search-input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--r1);
      padding: var(--s1) var(--s2);
      background: var(--surface-2);
      color: var(--text);
      font-size: 0.8125rem;
      outline: none;
    }

    .combobox-search-input:focus { border-color: var(--border-focus); }

    .combobox-options {
      overflow-y: auto;
      flex: 1;
    }

    .combobox-option {
      display: flex;
      align-items: center;
      gap: var(--s2);
      padding: var(--s2) var(--s3);
      font-size: 0.8125rem;
      cursor: pointer;
      user-select: none;
      transition: background var(--ease);
    }

    .combobox-option:hover { background: var(--surface-2); }

    .combobox-check {
      width: 14px;
      flex-shrink: 0;
      color: var(--accent);
      font-size: 0.875rem;
      visibility: hidden;
    }

    .combobox-check.shown { visibility: visible; }

    .combobox-tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: hsl(var(--tag-hue, 214), 65%, 50%);
      flex-shrink: 0;
    }

    .combobox-new-hint {
      padding: var(--s2) var(--s3);
      font-size: 0.75rem;
      color: var(--text-2);
      cursor: pointer;
      border-top: 1px solid var(--border);
    }

    .combobox-new-hint:hover { background: var(--surface-2); }

    .kanban-board { cursor: grab; }
    .kanban-board.is-panning { cursor: grabbing !important; user-select: none; }
    .kanban-column { cursor: default; }

    /* Drop-line indicator between cards (doesn't shift layout) */
    .task-card.drop-line-before { position: relative; }
    .task-card.drop-line-before::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: calc(-2 * var(--s1) + 2px);
      height: 2px;
      background: var(--accent);
      border-radius: 1px;
      pointer-events: none;
      z-index: 5;
    }

    /* Column drag-over: draw a line to the left of the hovered column */
    .kanban-column.col-drop-line-before { position: relative; }
    .kanban-column.col-drop-line-before::before {
      content: '';
      position: absolute;
      left: calc(-1 * var(--s2));
      top: 10%;
      height: 80%;
      width: 2px;
      background: var(--accent);
      border-radius: 1px;
      z-index: 10;
      pointer-events: none;
    }

    .list-drag-row { opacity: 0.4; }
    .list-table tr.drop-line-before td { border-top: 2px solid var(--accent) !important; }

    /* ─────────────────────────────────────────────
       CUSTOM SCROLLBARS
       ───────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-3); }
    * { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

    /* ─────────────────────────────────────────────
       ERROR TOAST  (top-centre, click-to-dismiss)
       ───────────────────────────────────────────── */
    .error-toast {
      position: fixed;
      top: var(--s5);
      left: 50%;
      transform: translateX(-50%);
      max-width: 300px;
      width: max-content;
      padding: var(--s3) var(--s4);
      background: var(--danger);
      color: #fff;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--r2);
      box-shadow: var(--shadow-md);
      z-index: 400;
      cursor: pointer;
      text-align: center;
      word-break: break-word;
    }
  </style>
</head>

<body>
<div id="app" x-data="kanbanApp()" x-cloak>

  <!-- ── HEADER ── -->
  <header id="header" role="banner">

    <!-- Logo / title -->
    <div class="header-logo" aria-label="Flat Kanban">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7" height="18" rx="1"/>
        <rect x="14" y="3" width="7" height="11" rx="1"/>
      </svg>
      Flat Kanban
    </div>

    <!-- View tabs -->
    <nav class="view-tabs" role="tablist" aria-label="Views">
      <button role="tab"
              class="view-tab"
              :class="{ active: currentView === 'kanban' }"
              :aria-selected="currentView === 'kanban'"
              @click="currentView = 'kanban'">Kanban</button>
      <button role="tab"
              class="view-tab"
              :class="{ active: currentView === 'list' }"
              :aria-selected="currentView === 'list'"
              @click="currentView = 'list'">List</button>
      <button role="tab"
              class="view-tab"
              :class="{ active: currentView === 'raw' }"
              :aria-selected="currentView === 'raw'"
              @click="switchToRaw()">Raw</button>
    </nav>

    <div class="header-spacer"></div>

    <!-- Theme toggle -->
    <button class="icon-btn"
            aria-label="Toggle theme"
            @click="toggleTheme()"
            :title="'Theme: ' + theme">
      <!-- sun (light) -->
      <svg x-show="theme === 'light'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <!-- moon (dark) -->
      <svg x-show="theme === 'dark'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <!-- circle (auto) -->
      <svg x-show="theme === 'auto'" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
           viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 3v18M3 12h18" stroke-dasharray="2 3"/>
      </svg>
    </button>

  </header><!-- /header -->

  <!-- Kanban subheader (columns filter + search) -->
  <div id="subheader" x-show="currentView === 'kanban'">
    <span class="filter-label">Columns</span>
    <div class="combobox-wrap" @click.outside="colCb.open = false; colCb.search = ''">
      <button class="combobox-btn" type="button"
              @click="colCb.open = !colCb.open; $nextTick(() => colCb.open && $refs.colSearch && $refs.colSearch.focus())"
              :aria-expanded="colCb.open"
              aria-label="Columns filter">
        <span x-text="colDisplayText()"></span>
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="combobox-dropdown" x-show="colCb.open">
        <div class="combobox-search-row">
          <input type="text" class="combobox-search-input" x-ref="colSearch"
                 x-model="colCb.search" placeholder="Search tags…"
                 @keydown.escape.stop="colCb.open = false; colCb.search = ''" />
        </div>
        <div class="combobox-options">
          <div class="combobox-option" @click="colSetSpecial('none')">
            <span class="combobox-check" :class="{ shown: colIsSpecial('none') }">&#10003;</span>
            None
          </div>
          <div class="combobox-option" @click="colSetSpecial('all')">
            <span class="combobox-check" :class="{ shown: colIsSpecial('all') }">&#10003;</span>
            All tags
          </div>
          <template x-for="tag in colFilteredTags()" :key="tag">
            <div class="combobox-option" @click.stop="colToggleTag(tag)">
              <span class="combobox-check" :class="{ shown: colIsSelected(tag) }">&#10003;</span>
              <span class="combobox-tag-dot" :style="`--tag-hue: ${tagHue(tag)}`"></span>
              <span x-text="tag"></span>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div class="search-wrap" @click.outside="searchSuggestOpen = false">
            <input class="search-input"
              type="search"
              placeholder="Search tasks…"
              x-ref="searchInput"
              x-model="searchQuery"
              @focus="searchSuggestOpen = true"
              @keydown.escape="searchSuggestOpen = false"
              aria-label="Search tasks"
              aria-autocomplete="list"
              :aria-expanded="searchSuggestOpen" />
      <div class="search-suggest-dropdown"
           x-show="searchSuggestOpen && searchSuggestions.length > 0">
        <template x-for="tag in searchSuggestions" :key="tag">
          <div class="search-suggest-item"
               @mousedown.prevent="selectSearchSuggestion(tag)">
            <span class="combobox-tag-dot" :style="`--tag-hue: ${tagHue(tag)}`"></span>
            <span x-text="tag"></span>
          </div>
        </template>
      </div>
    </div>
  </div><!-- /subheader -->

  <!-- List subheader (group by + search) -->
  <div id="list-subheader" x-show="currentView === 'list'">
    <span class="filter-label">Group by</span>
    <div class="combobox-wrap" @click.outside="groupCb.open = false; groupCb.search = ''">
      <button class="combobox-btn" type="button"
              @click="groupCb.open = !groupCb.open; $nextTick(() => groupCb.open && $refs.groupSearch && $refs.groupSearch.focus())"
              :aria-expanded="groupCb.open"
              aria-label="Group by">
        <span x-text="groupDisplayText()"></span>
        <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>
      <div class="combobox-dropdown" x-show="groupCb.open">
        <div class="combobox-search-row">
          <input type="text" class="combobox-search-input" x-ref="groupSearch"
                 x-model="groupCb.search" placeholder="Search tags…"
                 @keydown.escape.stop="groupCb.open = false; groupCb.search = ''" />
        </div>
        <div class="combobox-options">
          <div class="combobox-option" @click="groupSetSpecial('none')">
            <span class="combobox-check" :class="{ shown: groupIsSpecial('none') }">&#10003;</span>
            None
          </div>
          <div class="combobox-option" @click="groupSetSpecial('all')">
            <span class="combobox-check" :class="{ shown: groupIsSpecial('all') }">&#10003;</span>
            All tags
          </div>
          <template x-for="tag in groupFilteredTags()" :key="tag">
            <div class="combobox-option" @click.stop="groupToggleTag(tag)">
              <span class="combobox-check" :class="{ shown: groupIsSelected(tag) }">&#10003;</span>
              <span class="combobox-tag-dot" :style="`--tag-hue: ${tagHue(tag)}`"></span>
              <span x-text="tag"></span>
            </div>
          </template>
        </div>
      </div>
    </div>

    <div class="search-wrap" @click.outside="searchSuggestOpen = false">
      <input class="search-input"
             type="search"
             placeholder="Search tasks…"
             x-ref="listSearchInput"
             x-model="searchQuery"
             @focus="searchSuggestOpen = true"
             @keydown.escape="searchSuggestOpen = false"
             aria-label="Search tasks"
             aria-autocomplete="list"
             :aria-expanded="searchSuggestOpen" />
      <div class="search-suggest-dropdown"
           x-show="searchSuggestOpen && searchSuggestions.length > 0">
        <template x-for="tag in searchSuggestions" :key="tag">
          <div class="search-suggest-item"
               @mousedown.prevent="selectSearchSuggestion(tag)">
            <span class="combobox-tag-dot" :style="`--tag-hue: ${tagHue(tag)}`"></span>
            <span x-text="tag"></span>
          </div>
        </template>
      </div>
    </div>
  </div><!-- /list-subheader -->

  <!-- ── MAIN CONTENT ── -->
  <main id="main" role="main">

    <!-- Kanban view -->
    <div class="view-panel kanban-panel" x-show="currentView === 'kanban'" role="tabpanel" aria-label="Kanban view">
      <p class="placeholder-panel" x-show="tasks.length === 0"
         x-text="'No tasks yet.'"></p>

      <!-- Board: one column per tag -->
      <div class="kanban-board" x-show="tasks.length > 0 || tagFilter === 'all'" role="list"
           x-ref="kanbanBoard"
           :class="{ 'is-panning': boardPanning }"
           @mousedown="boardMouseDown($event)"
           @wheel.passive="false"
           @wheel="boardWheelScroll($event)">
        <template x-for="col in columns" :key="col.tag">
          <div class="kanban-column" role="listitem"
               :data-column-tag="col.tag"
               :class="{ 'col-drop-line-before': colDropTarget === col.tag && colDragSource }"
               @dragover.prevent="colDragSource ? colHeaderDragOver($event, col.tag) : null"
               @dragleave="colDragSource && colColumnDragLeave($event)"
               @drop.prevent="colDragSource ? colHeaderDrop($event, col.tag) : null">

            <!-- Column header -->
            <div class="kanban-column-header"
                 :draggable="col.tag !== '' && col.tag !== '__untagged__'"
                 @dragstart.stop="col.tag && col.tag !== '__untagged__' && colHeaderDragStart($event, col.tag)"
                 @dragend.stop="colHeaderDragEnd()">
                <!-- Column title: show only for tagged or untagged columns. Hide when tag is empty. -->
                <span class="column-tag-name"
                  x-show="col.tag === '__untagged__'"
                  x-text="'Untagged'"></span>
                <span class="column-tag-name"
                  x-show="col.tag && col.tag !== '__untagged__'"
                  :style="`--tag-hue: ${tagHue(col.tag)}`"
                  x-text="col.tag"></span>
              <span class="column-count" x-text="col.tasks.length" :aria-label="col.tasks.length + ' tasks'"></span>
              <!-- Drag handle — shown on hover only for draggable (tagged) columns -->
              <span class="column-drag-handle" x-show="col.tag !== '' && col.tag !== '__untagged__'" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                     fill="currentColor" aria-hidden="true">
                  <circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/>
                  <circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/>
                  <circle cx="9" cy="19" r="1.5"/><circle cx="15" cy="19" r="1.5"/>
                </svg>
              </span>
            </div>

            <!-- Drop zone + cards -->
            <div class="kanban-cards"
                 @dragover.prevent="col.tag === '' ? flatBoardDragOver($event) : dragOver($event, col.tag)"
                 @dragleave.self="dragLeave($event)"
                 @drop.prevent="dropOnColumn($event, col.tag)"
                 :class="{ dragover: col.tag !== '' && col.tag !== '__untagged__' && dropTarget === col.tag }"
                 :aria-label="col.tag + ' column drop zone'">

              <div class="column-empty" x-show="col.tasks.length === 0">
                Drop tasks here
              </div>

              <template x-for="task in col.tasks" :key="task.id + '-' + col.tag">
                 <div class="task-card"
                   :draggable="tagFilter !== 'none'"
                   :data-task-id="task.id"
                     @dragstart="dragStart($event, task, col.tag)"
                     @dragend="dragEnd()"
                     @dragover.prevent="flatCardDragOver($event, task, col.tag)"
                     @click.stop="openTask(task)"
                     :class="{
                       dragging:          draggedTask && draggedTask.id === task.id,
                       'drop-line-before': col.tag === '' && dropBeforeId === task.id
                     }"
                     role="button"
                     tabindex="0"
                     @keydown.enter.prevent="openTask(task)"
                     @keydown.space.prevent="openTask(task)"
                     :aria-label="'Open task: ' + displayTitle(task)">
                  <!-- Drag handle — top-right corner, shown on hover only when ordering is enabled -->
                  <span class="task-card-drag-handle" aria-hidden="true" x-show="tagFilter !== 'none'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                         fill="currentColor" aria-hidden="true">
                      <circle cx="9" cy="5" r="1.5"/><circle cx="15" cy="5" r="1.5"/>

<!-- Application script: CONSTANTS | PARSER | SERIALIZER | STORAGE | APP -->
<script>
/* ─────────────────────────────────────────────────
   CONSTANTS
   ───────────────────────────────────────────────── */
const STORAGE_KEY   = 'pk_db';
const PREF_MARKER   = '---PREFERENCES---';
const TASK_SEP      = '\n---\n';
const TITLE_RE      = /#title\(([^)]*)\)/;
const TAG_RE        = /(?<!\\)#([a-zA-Z0-9][a-zA-Z0-9_-]*)/g;
// A line is a "managed metadata line" if every non-empty token starts with #
const MANAGED_LINE_RE = /^(\s*#[a-zA-Z0-9][a-zA-Z0-9_-]*\s*)+$/;
const TITLE_LINE_RE   = /^#title\([^)]*\)$/;
const AUTOSAVE_DELAY  = 400;   // ms debounce for UI edits
const SNIPPET_WORDS   = 20;
const TITLE_FALLBACK_WORDS = 8;

/* ─────────────────────────────────────────────────
   PARSER  (text → model)
   Rules:
   - Split on TASK_SEP to get blocks
   - Preferences section follows PREF_MARKER line
   - #title(...) anywhere in block → explicit title
   - #word tokens (not inside #title) → tags (normalized)
   ───────────────────────────────────────────────── */

/** Parse a raw #title(...) out of a block string. Returns title string or null. */
function parseTitle(block) {
  const m = block.match(TITLE_RE);
  return m ? m[1].trim() : null;
}

/** Collect all #tag tokens, excluding the literal word "title" used in #title(). */
function parseTags(block) {
  // Strip #title(...) occurrences first so "title" token is not captured
  const stripped = block.replace(/#title\([^)]*\)/g, '');
  const tags = new Set();
  let m;
  TAG_RE.lastIndex = 0;
  while ((m = TAG_RE.exec(stripped)) !== null) {
    tags.add(m[1].toLowerCase());
  }
  return [...tags];
}

/** Parse a single block of raw text into a Task object. */
function parseTask(raw, id) {
  if (raw === '') return null; // soft-deleted tombstone
  const trimmed = raw.trim();
  return {
    id,
    raw: trimmed || raw, // preserve whitespace-only blocks as empty tasks
    title: parseTitle(raw),
    tags:  parseTags(raw),
  };
}

/** Parse preferences key=value text into a Preferences object. */
function parsePreferences(text) {
  const defaults = {
    theme:        'auto',
    tagFilter:    'all',
    listGroupBy:  'none',
    tagOrder:     [],
    taskOrder:    {},
  };
  if (!text) return defaults;
  for (const line of text.split('\n')) {
    const eq = line.indexOf('=');
    if (eq === -1) continue;
    const k = line.slice(0, eq).trim();
    const v = line.slice(eq + 1).trim();
    if (k in defaults) {
      if (k === 'tagOrder') {
        defaults[k] = v ? v.split(',').filter(Boolean) : [];
      } else if (k === 'taskOrder') {
        try { defaults[k] = JSON.parse(v); } catch { defaults[k] = {}; }
      } else if ((k === 'tagFilter' || k === 'listGroupBy') && v.includes(',')) {
        defaults[k] = v.split(',').filter(Boolean);
      } else {
        defaults[k] = v;
      }
    }
  }
  return defaults;
}

/**
 * parseDatabase(text) → { tasks: Task[], preferences: Preferences }
 * Round-trip safe: tasks preserve their original `raw` strings.
 */
function parseDatabase(text) {
  let mainText = text;
  let prefText = '';

  const prefIdx = text.indexOf(PREF_MARKER);
  if (prefIdx !== -1) {
    mainText = text.slice(0, prefIdx);
    prefText = text.slice(prefIdx + PREF_MARKER.length);
  }

  const tasks = mainText
    .split(TASK_SEP)
    .map((block, i) => parseTask(block, i + 1))
    .filter(Boolean);

  return { tasks, preferences: parsePreferences(prefText) };
}

/**
 * escapeBody(text) → escaped text safe for raw storage.
 * Prevents the parser from misreading body prose as tag or separator syntax.
 *   #word  →  \#word   (avoids spurious tag detection)
 *   ---    →  \---    (avoids task-separator split, line-anchored)
 */
function escapeBody(text) {
  if (!text) return '';
  return text
    .replace(/(?<!\\)#([a-zA-Z0-9])/g, '\\#$1')
    .replace(/^---$/gm, '\\---');
}

/**
 * unescapeBody(text) → display text.
 * Reverses escapeBody for rendering in the UI.
 */
function unescapeBody(text) {
  if (!text) return '';
  return text
    .replace(/\\#([a-zA-Z])/g, '#$1')
    .replace(/^\\---$/gm, '---');
}

/* ─────────────────────────────────────────────────
   SERIALIZER  (model → text)
   Round-trip rule: tasks are stored by their .raw — never reprocessed unless
   the user edits them via UI, in which case buildTaskRaw() rebuilds the block.
   ───────────────────────────────────────────────── */

/**
 * Extract the "body" of a task block — everything that is NOT a managed
 * metadata line (#title(...) or a line consisting solely of #tag tokens).
 * Preserves user prose verbatim.
 */
function extractBody(raw) {
  const lines = raw.split('\n');
  const bodyLines = lines.filter(line => {
    const t = line.trim();
    if (!t) return true;                      // keep blank lines
    if (TITLE_LINE_RE.test(t)) return false;  // managed title line
    if (MANAGED_LINE_RE.test(t)) return false; // managed tag line
    return true;
  });
  return unescapeBody(bodyLines.join('\n').trimEnd());
}

/**
 * Rebuild a task block from its constituent parts.
 * Managed metadata is placed at the top; user body follows (escaped).
 */
function buildTaskRaw(title, tags, body) {
  const parts = [];
  if (title && title.trim()) parts.push(`#title(${title.trim()})`);
  if (tags && tags.length)   parts.push(tags.map(t => `#${t}`).join(' '));
  const escaped = body ? escapeBody(body.trim()) : '';
  if (escaped) parts.push(escaped);
  // An empty task (no title, no tags, no body) uses a single newline as a live-task
  // marker to distinguish it from a soft-deleted tombstone (raw = '').
  if (!parts.length) return '\n';
  return parts.join('\n');
}

/** Serialize preferences object to key=value lines. */
function serializePreferences(prefs) {
  return Object.entries(prefs).map(([k, v]) => {
    if (k === 'taskOrder') return `${k}=${JSON.stringify(v)}`;
    const val = Array.isArray(v) ? v.join(',') : v;
    return `${k}=${val}`;
  }).join('\n');
}

/**
 * serializeDatabase(tasks, preferences) → string
 * Joins task.raw values (including soft-deleted blank blocks) with TASK_SEP;
 * appends preferences section. Blank blocks preserve task indices.
 */
function serializeDatabase(tasks, preferences) {
  let body = tasks.map(t => t.raw ?? '').join(TASK_SEP);
  // Collapse blank lines between consecutive separators from soft-deleted tombstones.
  // Loop until stable to handle multiple consecutive soft-deleted tasks.
  let prev;
  do {
    prev = body;
    body = body.replace(/\n---\n\n(?=---\n)/g, '\n---\n');
  } while (body !== prev);
  const prefSection = `\n${PREF_MARKER}\n${serializePreferences(preferences)}`;
  return body + prefSection;
}

/* ─────────────────────────────────────────────────
   STORAGE  (localStorage + demo seed)
   ───────────────────────────────────────────────── */

/** Load raw text from localStorage, falling back to demo seed on first run. */
function loadFromStorage() {
  return localStorage.getItem(STORAGE_KEY) ?? DEMO_DATA;
}

/** Persist raw text to localStorage. */
function saveToStorage(text) {
