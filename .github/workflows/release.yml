name: Release

on: push

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: wails/go.mod

      # - name: Install Wails CLI
      #   run: |
      #     go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      # - name: Install system dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev mingw-w64

      - name: Inject product version into wails.json
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.info.productVersion = $v' wails/wails.json > wails/wails.json.tmp
          mv wails/wails.json.tmp wails/wails.json

      - name: Build Linux
        working-directory: wails
        run: go tool wails build -platform linux/amd64 -o flat-kanban-${{ github.ref_name }}

      - name: Build Windows
        working-directory: wails
        env:
          CC: x86_64-w64-mingw32-gcc
        run: go tool wails build -platform windows/amd64 -o flat-kanban-${{ github.ref_name }}.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            wails/build/bin/flat-kanban-${{ github.ref_name }}
            wails/build/bin/flat-kanban-${{ github.ref_name }}.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/flat-kanban-${{ github.ref_name }}
            dist/flat-kanban-${{ github.ref_name }}.exe

